<title>Legency ESOS Site Data Collection</title>
<style>
:root{--paper:#F3F4F2;--ink:#1E232A;--soft:#616B76;--line:#D6DAD6;--navy:#2C3E4C;--req:#B4453D;--card:#fff;--red:#C0392B;--amb:#E0A11B;--grn:#2E8B57;--optbg:#EDEFEC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171A1D;--ink:#E7E9E6;--soft:#9AA2AA;--line:#2E3339;--card:#1F2327;--optbg:#252A2E;--navy:#5B7A90}}
:root[data-theme="dark"]{--paper:#171A1D;--ink:#E7E9E6;--soft:#9AA2AA;--line:#2E3339;--card:#1F2327;--optbg:#252A2E;--navy:#5B7A90}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
h2,h3{margin:0}input,select,textarea,button{font-family:inherit;color:inherit}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:.95rem}
textarea{min-height:3.6em;resize:vertical;overflow:hidden}button{cursor:pointer;border:none;border-radius:6px;font-weight:600}
.pri{background:var(--navy);color:#fff;padding:.7rem 1rem;font-size:.92rem}.gh{background:transparent;border:1px solid var(--line);padding:.5rem .8rem;font-size:.85rem}
.dng{background:transparent;color:var(--req);border:1px solid var(--req);padding:.45rem .75rem;font-size:.82rem}
header{position:sticky;top:0;z-index:10;background:var(--paper);padding:calc(env(safe-area-inset-top,0px) + .8rem) 1rem .6rem;border-bottom:1px solid var(--line)}
.crumb{font-size:.8rem;color:var(--soft);margin-top:.25rem}.crumb a{color:var(--navy);cursor:pointer}
main{padding:1rem 1rem 16rem;max-width:680px;margin:0 auto}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--paper);border-top:1px solid var(--line);padding:.6rem 1rem calc(env(safe-area-inset-bottom,0px) + .6rem);display:flex;gap:.5rem}.bar button{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin-bottom:.65rem}
.row{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;margin-bottom:.5rem;width:100%;text-align:left;font-size:.95rem;font-weight:500}
.row .t{flex:1}.row small{display:block;color:var(--soft);font-weight:400;font-size:.78rem;margin-top:.1rem}
.dot{width:.9rem;height:.9rem;border-radius:50%;flex:none;background:var(--line)}.dot.r{background:var(--red)}.dot.a{background:var(--amb)}.dot.g{background:var(--grn)}.dot.n{background:transparent;border:2px solid var(--grn)}
.dots{display:flex;gap:.25rem;margin-top:.5rem;flex-wrap:wrap}.dots .dot{width:.55rem;height:.55rem}
.sum{font-size:.9rem;margin:.2rem 0 1rem;color:var(--soft)}
details.blk{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:.7rem}
details.blk>summary{padding:.75rem 1rem;font-weight:700;font-size:.95rem;cursor:pointer;list-style:none}
details.blk>summary small{font-weight:400;color:var(--soft);margin-left:.4rem}
.bb{padding:0 1rem 1rem}details.opt{margin-top:.8rem;background:var(--optbg);border-radius:8px;padding:.1rem .8rem .7rem}
details.opt>summary{padding:.6rem 0;font-size:.85rem;font-weight:600;cursor:pointer}
.note{font-size:.78rem;color:var(--soft);line-height:1.4;margin:.2rem 0 .4rem}
.fld{margin:.6rem 0;padding-left:.6rem;border-left:3px solid transparent}.fld.rq{border-left-color:var(--req)}.fld.ok{border-left-color:var(--grn)}
label{display:block;font-size:.8rem;color:var(--soft);margin-bottom:.2rem}.fld.rq label,.fld.ok label{color:var(--ink);font-weight:600}
label b{color:var(--req);font-weight:600;font-size:.72rem;margin-left:.3rem}
.inp{display:flex;gap:.4rem}.mic{flex:none;width:2.6rem;background:var(--optbg);font-size:1rem}.mic.rec{background:var(--red);color:#fff}
.auto{padding:.55rem .7rem;background:var(--optbg);border-radius:6px;font-size:.92rem}
.ban{padding:.6rem .8rem;border-radius:8px;font-size:.85rem;margin-bottom:.8rem;background:#F6DEDC;color:#6B2A25}.ban.ok{background:#DDEFE4;color:#1E5A38}
.dz{border:2px dashed transparent;border-radius:12px;padding:.25rem;transition:background .15s,border-color .15s}.dz.over{border-color:var(--grn);background:rgba(46,139,87,.10)}.dzhint{font-size:.78rem;color:var(--soft);margin:.1rem 0 .4rem}
.media{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}.thumbs{display:flex;gap:.5rem;flex-wrap:wrap}
.th{position:relative}.th img{width:5.2rem;height:5.2rem;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.th button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:1.4rem;height:1.4rem;font-size:.8rem;padding:0}
.doc{display:flex;gap:.5rem;align-items:center;margin:.35rem 0;padding:.4rem .5rem;border:1px solid var(--bd,#d0d5dd);border-radius:10px;width:100%}.doc .di{font-size:1.5rem}.doc .dn{flex:1;min-width:0}.doc .dn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}.doc .dn span{font-size:.75rem;color:var(--soft)}
#dvw{position:fixed;inset:0;z-index:50;background:var(--paper,#fff);color:var(--ink,#111);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#dvw .gh{color:var(--ink,#111);background:var(--card,#fff);border:1px solid var(--soft,#888)}#dvw .gh:disabled{opacity:.35}#dvw .dvc{background:var(--card,#eee)}#dvw canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#dvw .dvb{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.5rem .7rem;border-bottom:1px solid #8884}
#dvw button{white-space:nowrap}
#dvw .zg{display:flex;gap:.4rem;align-items:center}
@media(max-width:640px){#dvw .zg{order:9;flex:1 1 100%}#dvw .dvb b{font-size:.95rem;min-width:2rem}}#dvw .dvb b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#dvw .dvc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}#dvw iframe{width:100%;height:100%;border:0}#dvw .dvb.tb{flex-wrap:wrap;gap:.35rem}#dvw .on{outline:2px solid #2e8b57;background:rgba(46,139,87,.28)!important}#dvw .ub{display:inline-flex;align-items:center;gap:.3rem;font-weight:600}#dvw .wset{display:inline-flex;gap:.2rem;align-items:center;padding:0 .2rem}#dvw .wdot{width:2.3rem;height:2.3rem;border-radius:.6rem;border:1px solid var(--soft,#888);background:var(--card,#fff);display:inline-flex;align-items:center;justify-content:center;padding:0}#dvw .wdot i{display:block;border-radius:50%;background:var(--ink,#111)}#dvw .cdot{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid #8886;padding:0}#dvw .pgw{position:relative;margin:6px auto}#dvw .pgw canvas{display:block}
#dvw .pgr{position:absolute;left:50%;top:50%}#dvw .ink{position:absolute;left:0;top:0;pointer-events:none}#dvw.drawing .ink{pointer-events:auto;touch-action:none;cursor:crosshair}#dvw.drawing .dvc{touch-action:none}
#dvw .dvm{padding:2rem 1.2rem;text-align:center}
#lbx{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:60;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#lbx img{position:absolute;left:50%;top:50%;max-width:94vw;max-height:86vh;transform:translate(-50%,-50%);transform-origin:center;will-change:transform;-webkit-user-drag:none}
#lbx button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:.7rem;min-width:2.8rem;height:2.8rem;font-size:1.5rem;line-height:1;padding:0 .7rem;cursor:pointer}
#lbx button:disabled{opacity:.3;cursor:default}
#lbx .lbt{position:fixed;top:1rem;left:1rem;display:flex;gap:.4rem}
#lbx .lbt .lbp{font-size:.95rem;min-width:4rem;font-weight:600}
#lbx .lbc{position:fixed;top:1rem;right:1rem;border-radius:50%;font-size:1.8rem}
#lbx .lbn{position:fixed;top:50%;transform:translateY(-50%);width:3.2rem;height:4.2rem;font-size:2.4rem}
#lbx .lbprev{left:.8rem}#lbx .lbnext{right:.8rem}
#lbx .lbcount{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:.25rem .8rem;border-radius:1rem;font-size:.95rem}
.aud{display:flex;gap:.4rem;align-items:center;margin:.3rem 0;width:100%}.aud audio{flex:1;height:2.2rem}
.sheet-b{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}.sheet-b.o{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:14px 14px 0 0;padding:1.1rem 1.1rem calc(env(safe-area-inset-bottom,0px) + 1.1rem);max-height:88vh;overflow:auto}
.toast{position:fixed;left:1rem;right:1rem;bottom:5rem;z-index:30;background:#222;color:#fff;padding:.7rem 1rem;border-radius:8px;font-size:.85rem;display:none}
.cn{font-size:1.45rem;font-weight:700;line-height:1.2}.site{border-top:1px solid var(--line);padding:.9rem 0 .3rem;cursor:pointer}.snr{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;margin-bottom:.55rem}.sn{font-size:1.15rem;font-weight:700;color:var(--ink);line-height:1.25}.sn .sd{font-size:.82rem;font-weight:400;color:var(--soft);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.2rem,1fr));gap:.5rem;margin-bottom:1rem}.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem}.tile b{display:block;font-size:1.25rem}.tile span{font-size:.72rem;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}.stats .tile{padding:.4rem .5rem}.stats .tile b{font-size:1.05rem}
.prog{height:.35rem;background:var(--line);border-radius:4px;margin:.6rem 0 .3rem;overflow:hidden}.prog div{height:100%;background:var(--grn)}
.sec{font-size:.92rem;font-weight:700;margin:1.1rem 0 .4rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
.themebtn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:.35rem .7rem;font-size:.8rem;color:var(--ink);flex:none;white-space:nowrap;align-self:flex-start}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem}

function startCloudSync(){
  surveysCol=dbFs.collection('users').doc(uidCur).collection('surveys');
  customersCol=dbFs.collection('users').doc(uidCur).collection('customerNotes');
  customersCol.get().then(snap=>{
    const cloudKeys=new Set(snap.docs.map(d=>d.id));
    Object.keys(CN).forEach(key=>{if(!cloudKeys.has(key)){CN[key]._updatedAt=CN[key]._updatedAt||Date.now();customersCol.doc(key).set(CN[key]).catch(()=>{})}});
  }).catch(()=>{});
  customersCol.onSnapshot({includeMetadataChanges:true},snap=>{
    let changed=false;
    snap.docChanges().forEach(ch=>{const key=ch.doc.id;
      if(ch.type==='removed'){if(CN[key]){delete CN[key];changed=true}return}
      const data=ch.doc.data(),local=CN[key];
      if(!local||(data._updatedAt||0)>(local._updatedAt||0)){CN[key]=data;changed=true}
    });
    if(!changed)return;
    try{localStorage.setItem('legency_cust_notes',JSON.stringify(CN))}catch(e){}
    if(V.s==='cust')return;
    paint();
  },err=>toast('Sync error: '+err.message));
  surveysCol.get().then(snap=>{
    const cloudIds=new Set(snap.docs.map(d=>d.id));
    Object.values(D).forEach(sv=>{if(!cloudIds.has(sv.id)){sv._updatedAt=sv._updatedAt||Date.now();surveysCol.doc(sv.id).set(sv).catch(()=>{})}});
    retryUploads();
  }).catch(()=>{});
  surveysCol.onSnapshot({includeMetadataChanges:true},snap=>{
    let changed=false;
    snap.docChanges().forEach(ch=>{const id=ch.doc.id;
      if(ch.type==='removed'){if(D[id]){delete D[id];changed=true}return}
      const data=ch.doc.data(),local=D[id];
      if(!local||(data._updatedAt||0)>(local._updatedAt||0)){D[id]=data;changed=true}
    });
    if(!changed)return;
    try{localStorage.setItem('inspired_v2',JSON.stringify(D))}catch(e){}
    if(V.s==='gen'||V.s==='ent')return;
    paint();
  },err=>toast('Sync error: '+err.message));
}

// ---------- fill the real Inspired .xlsm directly (port of fill_esos_workbook.py) ----------
// Single source of truth: this is wbfill/fillLogic.js verbatim (tested in Node against the real blank workbook).
// Port of fill_esos_workbook.py to the browser. Designed to be pasted into the app's
// inline <script> where JSZip, DOMParser and XMLSerializer are already global.
// Exposed here via a factory so it can also be exercised from a Node test harness.
function makeFillWorkbook({ JSZip, DOMParser, XMLSerializer }) {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  const colLetter = (n) => { let s = ''; while (n) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
  const colNum = (letters) => { let n = 0; for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64); return n; };
  const hasVal = (v) => v !== undefined && v !== null && String(v).trim() !== '';

  // Fields that exist in the app (Heating > "Other" > Split/VRF) but have no cell in Inspired's
  // real blank workbook at all. New rows for these are created at the bottom of the sheet the
  // first time a survey actually uses them, then cloned for each further instance — mirroring how
  // extra Meter Register entries are appended on the General tab, just starting from zero instead
  // of one pre-existing template row-set. Field order/labels/mandatory-flags/notes mirror the app's
  // own schema for these two blocks exactly.
  // Each entry: [label, mandatory ('M'/'O'), note shown in column E, data type for styling/
  // conversion purposes]. The "note" text (often just "Free text") is a description shown to the
  // surveyor and is NOT a reliable signal of the underlying data type - e.g. several "Free text"
  // fields below are actually numeric (kW values) - so the explicit 4th element is what decides
  // number formatting and value conversion, independent of the note wording.
  const SYNTHETIC_BLOCKS = {
    'Heating|Split / VRF System': [
      ['Location of External units', 'O', 'Free text', 'text'],
      ['External unit Make and Model', 'O', 'Free text', 'text'],
      ['External unit electrical power (kW)', 'M', 'Free text', 'number'],
      ['No. of External units', 'M', 'Free text', 'text'],
      ['Indoor unit Make and Model', 'O', 'Free text', 'text'],
      ['Indoor unit electrical power (kW)', 'M', 'Free text', 'number'],
      ['Indoor unit cooling output (kW)', 'O', 'Free text', 'number'],
      ['Indoor unit heating output (kW)', 'O', 'Free text', 'number'],
      ['No. of Internal units', 'M', 'Free text', 'text'],
      ['System COPref', 'O', 'Free text', 'text'],
      ['Approximate age of system (years)', 'O', 'Free text', 'text'],
    ],
    'Heating|Split / VRF System - Controls': [
      ['Type of controller', 'O', 'Free text', 'text'],
      ['HAND/AUTO/OFF', 'O', 'Free text', 'text'],
      ['Who operates/manages', 'O', 'Free text', 'text'],
      ['Space set point temperature(s)  (°C)', 'M', 'Numerical field only', 'number'],
      ['Monday Start Time', 'O', '24-hour format', 'time'],
      ['Monday End Time', 'O', '24-hour format', 'time'],
      ['Tuesday Start Time', 'O', '24-hour format', 'time'],
      ['Tuesday End Time', 'O', '24-hour format', 'time'],
      ['Wednesday Start Time', 'O', '24-hour format', 'time'],
      ['Wednesday End Time', 'O', '24-hour format', 'time'],
      ['Thursday Start Time', 'O', '24-hour format', 'time'],
      ['Thursday End Time', 'O', '24-hour format', 'time'],
      ['Friday Start Time', 'O', '24-hour format', 'time'],
      ['Friday End Time', 'O', '24-hour format', 'time'],
      ['Saturday Start Time', 'O', '24-hour format', 'time'],
      ['Saturday End Time', 'O', '24-hour format', 'time'],
      ['Sunday Start Time', 'O', '24-hour format', 'time'],
      ['Sunday End Time', 'O', '24-hour format', 'time'],
      ['Operating Weeks per Annum', 'O', 'Number', 'number'],
      ['Annualised Hours', 'O', ' Automatic', 'formula'],
    ],
  };

  function convertCell(type, v) {
    if (type === 'number') {
      const x = parseFloat(v);
      if (!isNaN(x) && isFinite(x)) return ['n', x];
      return ['s', v];
    }
    if (type === 'time') {
      const m = String(v).match(/^(\d{1,2}):(\d{2})/);
      if (m) return ['n', (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) / 1440];
      return ['s', v];
    }
    if (type === 'multi') {
      return ['s', String(v).split('\n').map(x => x.trim()).filter(Boolean).join(', ')];
    }
    return ['s', v];
  }

  function getRow(sheetData, n, doc) {
    const rows = Array.from(sheetData.getElementsByTagNameNS(NS, 'row'));
    for (const row of rows) {
      const r = parseInt(row.getAttribute('r'), 10);
      if (r === n) return row;
      if (r > n) { const nr = doc.createElementNS(NS, 'row'); nr.setAttribute('r', String(n)); row.parentNode.insertBefore(nr, row); return nr; }
    }
    const nr = doc.createElementNS(NS, 'row'); nr.setAttribute('r', String(n)); sheetData.appendChild(nr); return nr;
  }

  function getCell(row, ref, doc) {
    const colLetters = ref.match(/^[A-Z]+/)[0];
    const cn = colNum(colLetters);
    const cells = Array.from(row.getElementsByTagNameNS(NS, 'c'));
    for (const c of cells) {
      const cc = colNum(c.getAttribute('r').match(/^[A-Z]+/)[0]);
      if (cc === cn) return c;
      if (cc > cn) { const nc = doc.createElementNS(NS, 'c'); nc.setAttribute('r', ref); c.parentNode.insertBefore(nc, c); return nc; }
    }
    const nc = doc.createElementNS(NS, 'c'); nc.setAttribute('r', ref); row.appendChild(nc); return nc;
  }

  function cloneRowAt(sheetData, doc, srcRow, newR) {
    const clone = srcRow.cloneNode(true);
    clone.setAttribute('r', String(newR));
    const cells = Array.from(clone.getElementsByTagNameNS(NS, 'c'));
    for (const c of cells) {
      const col = c.getAttribute('r').match(/^[A-Z]+/)[0];
      c.setAttribute('r', col + newR);
      if (col === 'F') {
        while (c.firstChild) c.removeChild(c.firstChild);
        c.removeAttribute('t');
      }
    }
    sheetData.appendChild(clone);
    return clone;
  }

  function updateDimension(doc) {
    const dim = doc.getElementsByTagNameNS(NS, 'dimension')[0];
    if (!dim) return;
    const cells = doc.getElementsByTagNameNS(NS, 'c');
    const rows = doc.getElementsByTagNameNS(NS, 'row');
    if (!cells.length || !rows.length) return;
    let maxCol = 1, maxRow = 1;
    for (const c of cells) { const m = c.getAttribute('r').match(/^[A-Z]+/); if (m) { const cn = colNum(m[0]); if (cn > maxCol) maxCol = cn; } }
    for (const r of rows) { const rn = parseInt(r.getAttribute('r'), 10); if (rn > maxRow) maxRow = rn; }
    dim.setAttribute('ref', 'A1:' + colLetter(maxCol) + maxRow);
  }

  // rows: array of row objects with keys matching rowsFor()'s header:
  // Sheet, Entry, Zone, Block, Instance, Field, Requirement, Type, Value, Row, Overflow
  async function fillWorkbook(rows, templateArrayBuffer, opts) {
    opts = opts || {};
    const zin = await JSZip.loadAsync(templateArrayBuffer);
    const parser = new DOMParser();
    const serializer = new XMLSerializer();

    async function readXml(path) {
      const f = zin.file(path);
      if (!f) throw new Error('Missing part in workbook: ' + path);
      const txt = await f.async('string');
      return parser.parseFromString(txt, 'application/xml');
    }

    // Shared strings + a style "donor" row, used only to style brand-new synthetic rows so they
    // look consistent with the rest of the sheet. Read from whichever file was actually uploaded
    // (never hardcoded indices) so this keeps working across future revisions of the template.
    let sstCache = null;
    async function getSharedStrings() {
      if (sstCache) return sstCache;
      const f = zin.file('xl/sharedStrings.xml');
      if (!f) { sstCache = []; return sstCache; }
      const sdoc = parser.parseFromString(await f.async('string'), 'application/xml');
      sstCache = Array.from(sdoc.getElementsByTagNameNS(NS, 'si')).map(si =>
        Array.from(si.getElementsByTagNameNS(NS, 't')).map(t => t.textContent).join('')
      );
      return sstCache;
    }
    function cellText(c, sst) {
      const t = c.getAttribute('t');
      if (t === 'inlineStr') { const el = c.getElementsByTagNameNS(NS, 't')[0]; return el ? el.textContent : ''; }
      const v = c.getElementsByTagNameNS(NS, 'v')[0];
      if (!v) return '';
      if (t === 's') { const idx = parseInt(v.textContent, 10); return sst[idx] || ''; }
      return v.textContent;
    }
    // ---- styles.xml engine -------------------------------------------------------------------
    // Reads the uploaded file's own styles.xml (never hardcoded indices, so it survives template
    // revisions) and can derive new cellXfs entries from an existing one: swap a time number
    // format for General, and/or force centre + wrap alignment. Derived styles are cached.
    let styleCache = null;
    async function getStyleInfo() {
      if (styleCache) return styleCache;
      const f = zin.file('xl/styles.xml');
      if (!f) { styleCache = { isTime: () => false, isPercent: () => false, isGeneral: () => true, derive: (i) => i, modified: false, doc: null }; return styleCache; }
      const doc = parser.parseFromString(await f.async('string'), 'application/xml');
      const customFmts = {};
      const numFmtsEl = doc.getElementsByTagNameNS(NS, 'numFmts')[0];
      if (numFmtsEl) Array.from(numFmtsEl.getElementsByTagNameNS(NS, 'numFmt')).forEach(nf => { customFmts[nf.getAttribute('numFmtId')] = nf.getAttribute('formatCode') || ''; });
      const builtinTimeIds = new Set([18, 19, 20, 21, 45, 46, 47]); // built-in time-of-day formats
      const builtinPctIds = new Set([9, 10]);
      const cellXfsEl = doc.getElementsByTagNameNS(NS, 'cellXfs')[0];
      const xfs = cellXfsEl ? Array.from(cellXfsEl.getElementsByTagNameNS(NS, 'xf')) : [];
      const fmtOf = (idx) => { const xf = xfs[idx]; return xf ? xf.getAttribute('numFmtId') : null; };
      const isTime = (idx) => {
        const id = fmtOf(idx); if (id == null) return false;
        if (customFmts[id] === undefined) return builtinTimeIds.has(parseInt(id, 10));
        return /[hHmMsS]/.test(customFmts[id].replace(/"[^"]*"/g, '')) && !/[yYdD]/.test(customFmts[id]);
      };
      const isPercent = (idx) => {
        const id = fmtOf(idx); if (id == null) return false;
        if (customFmts[id] === undefined) return builtinPctIds.has(parseInt(id, 10));
        return customFmts[id].includes('%');
      };
      const hasCentreWrap = (xf) => {
        const al = xf.getElementsByTagNameNS(NS, 'alignment')[0];
        return !!al && al.getAttribute('horizontal') === 'center' && al.getAttribute('vertical') === 'center' && al.getAttribute('wrapText') === '1';
      };
      const cache = {};
      const isGeneral = (idx) => fmtOf(idx) === '0';
      const info = { isTime, isPercent, isGeneral, modified: false, doc };
      info.derive = (idx, opts2) => {
        idx = parseInt(idx, 10);
        const xf = xfs[idx]; if (!xf) return idx;
        const needGeneral = !!opts2.general && isTime(idx);
        const needCentre = !!opts2.centre && !hasCentreWrap(xf);
        if (!needGeneral && !needCentre) return idx;
        const key = idx + '|' + needGeneral + '|' + needCentre;
        if (key in cache) return cache[key];
        const nx = xf.cloneNode(true);
        if (needGeneral) { nx.setAttribute('numFmtId', '0'); nx.setAttribute('applyNumberFormat', '1'); }
        if (needCentre) {
          let al = nx.getElementsByTagNameNS(NS, 'alignment')[0];
          if (!al) { al = doc.createElementNS(NS, 'alignment'); nx.insertBefore(al, nx.firstChild); }
          al.setAttribute('horizontal', 'center'); al.setAttribute('vertical', 'center'); al.setAttribute('wrapText', '1');
          nx.setAttribute('applyAlignment', '1');
        }
        cellXfsEl.appendChild(nx);
        const ni = xfs.length; xfs.push(nx);
        cellXfsEl.setAttribute('count', String(xfs.length));
        cache[key] = ni; info.modified = true;
        return ni;
      };
      // Column C block-colour: force a cell style onto the solid #44546A fill (adds the fill / reuses the
      // font of an existing slate cell so the text stays readable). Cached per source style.
      const SLATE = 'FF44546A';
      const fillsEl = doc.getElementsByTagNameNS(NS, 'fills')[0];
      const fillRgb = (idx) => {
        const xf = xfs[idx]; if (!xf || !fillsEl) return null;
        const fl = fillsEl.getElementsByTagNameNS(NS, 'fill')[parseInt(xf.getAttribute('fillId') || '0', 10)];
        const pf = fl && fl.getElementsByTagNameNS(NS, 'patternFill')[0];
        const fg = pf && pf.getElementsByTagNameNS(NS, 'fgColor')[0];
        return pf && pf.getAttribute('patternType') === 'solid' && fg ? (fg.getAttribute('rgb') || null) : null;
      };
      const slateCache = {};
      info.fillRgb = fillRgb;
      info.forceSlate = (idx) => {
        idx = parseInt(idx, 10);
        if (isNaN(idx) || !xfs[idx] || !fillsEl) return idx;
        if (fillRgb(idx) === SLATE) return idx;
        if (idx in slateCache) return slateCache[idx];
        const fl = Array.from(fillsEl.getElementsByTagNameNS(NS, 'fill'));
        let fid = fl.findIndex(x => { const pf = x.getElementsByTagNameNS(NS, 'patternFill')[0], fg = x.getElementsByTagNameNS(NS, 'fgColor')[0]; return pf && pf.getAttribute('patternType') === 'solid' && fg && fg.getAttribute('rgb') === SLATE; });
        if (fid < 0) {
          const nf = doc.createElementNS(NS, 'fill'), pf = doc.createElementNS(NS, 'patternFill'), fg = doc.createElementNS(NS, 'fgColor'), bg = doc.createElementNS(NS, 'bgColor');
          pf.setAttribute('patternType', 'solid'); fg.setAttribute('rgb', SLATE); bg.setAttribute('indexed', '64');
          pf.appendChild(fg); pf.appendChild(bg); nf.appendChild(pf); fillsEl.appendChild(nf);
          fid = fl.length; fillsEl.setAttribute('count', String(fid + 1));
        }
        const nx = xfs[idx].cloneNode(true);
        nx.setAttribute('fillId', String(fid)); nx.setAttribute('applyFill', '1');
        const donor = xfs.find((x, i) => fillRgb(i) === SLATE && x.getAttribute('fontId'));
        if (donor) { nx.setAttribute('fontId', donor.getAttribute('fontId')); nx.setAttribute('applyFont', '1'); }
        cellXfsEl.appendChild(nx);
        const ni = xfs.length; xfs.push(nx);
        cellXfsEl.setAttribute('count', String(xfs.length));
        slateCache[idx] = ni; info.modified = true;
        return ni;
      };
      styleCache = info;
      return info;
    }
    // Finds representative "question rows" (column A reads exactly Mandatory/Optional - the universal
    // marker on real data rows) and returns the styles new rows should borrow, so they look native:
    //  - A..E: the most common style per column, separately for Mandatory and Optional rows (the two
    //    statuses are formatted differently in column A);
    //  - lastRow: the styles of a block's closing row (the 'Annualised Hours' row, which carries the
    //    thicker bottom border), used for the final row of each new block;
    //  - value column F: a time-formatted donor for time fields and a General-format donor for
    //    everything else (so 12.5 shows as 12.5, never as a time/date/0.00).
    async function findStyleDonor(sheetData) {
      const sst = await getSharedStrings();
      const { isTime, isGeneral, forceSlate } = await getStyleInfo();
      const tally = { Mandatory: {}, Optional: {} };
      let lastRow = null, timeF = null, generalF = null, anyF = null, firstC = null;
      const colOf = (c) => c.getAttribute('r').match(/^[A-Z]+/)[0];
      for (const row of Array.from(sheetData.getElementsByTagNameNS(NS, 'row'))) {
        if (parseInt(row.getAttribute('r'), 10) < 2) continue;
        const cells = Array.from(row.getElementsByTagNameNS(NS, 'c'));
        const aCell = cells.find(c => colOf(c) === 'A');
        if (!aCell) continue;
        const status = cellText(aCell, sst).trim();
        if (status !== 'Mandatory' && status !== 'Optional') continue;
        const styles = {}; const texts = {};
        cells.forEach(c => { const s = c.getAttribute('s'); if (s != null) styles[colOf(c)] = s; texts[colOf(c)] = cellText(c, sst).trim(); });
        if (!styles.A || !styles.F) continue;
        ['A', 'B', 'C', 'D', 'E'].forEach(col => { if (styles[col] != null) { const t = tally[status][col] = tally[status][col] || {}; t[styles[col]] = (t[styles[col]] || 0) + 1; } });
        if (firstC == null && styles.C != null) firstC = styles.C;
        if (!lastRow && texts.D === 'Annualised Hours') lastRow = styles;
        if (anyF == null) anyF = styles.F;
        const fIdx = parseInt(styles.F, 10);
        if (isTime(fIdx)) { if (timeF == null && /Start Time/.test(texts.D)) timeF = styles.F; }
        else if (generalF == null && isGeneral(fIdx)) generalF = styles.F;
      }
      const mode = (obj) => { let best = null, n = -1; for (const k in (obj || {})) if (obj[k] > n) { n = obj[k]; best = k; } return best; };
      const pick = (status) => { const o = {}; ['A', 'B', 'C', 'D', 'E'].forEach(c => { const m = mode(tally[status][c]); if (m != null) o[c] = m; }); return o; };
      const mand = pick('Mandatory'), opt = pick('Optional');
      // Column C: use the sheet's first block colour (not the modal one, which can be a grey sub-section style)
      if (firstC != null) { const sc = String(forceSlate ? forceSlate(firstC) : firstC); mand.C = sc; opt.C = sc; if (lastRow) lastRow = Object.assign({}, lastRow, { C: sc }); }
      const base = Object.keys(opt).length >= 5 ? opt : mand;
      if (!base.A) return {};
      // Prefer the 'Operating Weeks' F style (General, same border as time cells) when present.
      return {
        Mandatory: Object.assign({}, opt, mand), Optional: Object.assign({}, mand, opt), lastRow: lastRow || null,
        F: { time: timeF != null ? timeF : anyF, general: generalF, anyF },
      };
    }

    const wbDoc = await readXml('xl/workbook.xml');
    const relsTxt = await zin.file('xl/_rels/workbook.xml.rels').async('string');
    const relsDoc = parser.parseFromString(relsTxt, 'application/xml');
    const relMap = {};
    Array.from(relsDoc.getElementsByTagName('Relationship')).forEach(r => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });
    const paths = {};
    Array.from(wbDoc.getElementsByTagNameNS(NS, 'sheet')).forEach(s => {
      const name = s.getAttribute('name');
      const rid = s.getAttributeNS(RNS, 'id');
      const target = relMap[rid];
      if (!target) return;
      paths[name] = target.replace(/^\.?\//, '').startsWith('xl/') ? target.replace(/^\.?\//, '') : 'xl/' + target.replace(/^\.?\//, '');
    });

    const notes = [];
    const generalRows = rows.filter(r => r.Sheet === 'General' && hasVal(r.Row));
    const templateRows = {};
    generalRows.forEach(r => { (templateRows[r.Block] = templateRows[r.Block] || new Set()).add(Number(r.Row)); });
    // The app passes the FULL row list of every General block (not just the rows that happen to hold a
    // value), so a cloned extra entry (e.g. Meter 2) gets every row of the block - including trailing
    // optional rows left blank, such as 'Sub-meter coverage / profile notes'.
    if (opts.blockRows) for (const b of Object.keys(opts.blockRows)) { templateRows[b] = templateRows[b] || new Set(); opts.blockRows[b].forEach(x => templateRows[b].add(Number(x))); }
    const overflowGroups = {};
    generalRows.forEach(r => { if (String(r.Overflow) === '1') { const k = r.Block + '|' + r.Instance; (overflowGroups[k] = overflowGroups[k] || []).push(r); } });

    const trees = {};
    const rowRedirect = {};

    if (Object.keys(overflowGroups).length && paths['General']) {
      const genDoc = await readXml(paths['General']);
      const sheetData = genDoc.getElementsByTagNameNS(NS, 'sheetData')[0];
      let maxR = 0;
      Array.from(sheetData.getElementsByTagNameNS(NS, 'row')).forEach(rw => { maxR = Math.max(maxR, parseInt(rw.getAttribute('r'), 10)); });
      let nextRow = maxR + 2;
      const groupKeys = Object.keys(overflowGroups).sort((a, b) => {
        const ai = a.lastIndexOf('|'), bi = b.lastIndexOf('|');
        const ba = a.slice(0, ai), bb = b.slice(0, bi);
        if (ba !== bb) return ba < bb ? -1 : 1;
        return Number(a.slice(ai + 1)) - Number(b.slice(bi + 1));
      });
      for (const key of groupKeys) {
        const idx = key.lastIndexOf('|');
        const block = key.slice(0, idx), instance = key.slice(idx + 1);
        const tmpl = Array.from(templateRows[block] || []).sort((a, b) => a - b);
        if (!tmpl.length) continue;
        const base = nextRow;
        const rowsArr = Array.from(sheetData.getElementsByTagNameNS(NS, 'row'));
        tmpl.forEach((origRow, offset) => {
          const src = rowsArr.find(rw => parseInt(rw.getAttribute('r'), 10) === origRow);
          if (!src) return;
          const newR = base + offset;
          cloneRowAt(sheetData, genDoc, src, newR);
          rowRedirect[block + '|' + instance + '|' + origRow] = newR;
        });
        nextRow = base + tmpl.length + 1;
        notes.push(`General: added '${block}' entry ${instance} as new rows ${base}-${base + tmpl.length - 1} at the bottom of the sheet`);
      }
      trees['General'] = genDoc;
    }

    // ---- synthetic blocks: fields that exist in the app but have no cell anywhere in the ----
    // ---- real workbook (currently just Heating > Split/VRF). Create them from scratch.     ----
    const synthRedirect = {}; // "sheet|block|instance|fieldLabel" -> row number
    const synthSheets = new Set(Object.keys(SYNTHETIC_BLOCKS).map(k => k.split('|')[0]));
    for (const sheetName of synthSheets) {
      if (!paths[sheetName]) continue;
      const pairs = new Set();
      rows.forEach(r => { if (r.Sheet === sheetName && SYNTHETIC_BLOCKS[sheetName + '|' + r.Block]) pairs.add(r.Block + '|' + r.Instance); });
      if (!pairs.size) continue;
      if (!trees[sheetName]) trees[sheetName] = await readXml(paths[sheetName]);
      const doc = trees[sheetName];
      const sheetData = doc.getElementsByTagNameNS(NS, 'sheetData')[0];
      const donorStyle = await findStyleDonor(sheetData);
      // How many entry columns (F, G, H, ...) this fill actually needs on this sheet - driven by
      // the highest Entry number present in the data, so this isn't limited to the first entry's
      // column. One Heating entry uses column F, a second uses G, a third H, and so on.
      let maxEntry = 1;
      rows.forEach(r => { if (r.Sheet === sheetName) maxEntry = Math.max(maxEntry, Number(r.Entry) || 1); });
      let maxR = 0;
      Array.from(sheetData.getElementsByTagNameNS(NS, 'row')).forEach(rw => { maxR = Math.max(maxR, parseInt(rw.getAttribute('r'), 10)); });
      let nextRow = maxR + 2;
      const sortedPairs = Array.from(pairs).sort((a, b) => {
        const ai = a.lastIndexOf('|'), bi = b.lastIndexOf('|');
        const ba = a.slice(0, ai), bb = b.slice(0, bi);
        if (ba !== bb) return ba < bb ? -1 : 1;
        return Number(a.slice(ai + 1)) - Number(b.slice(bi + 1));
      });
      for (const pk of sortedPairs) {
        const idx = pk.lastIndexOf('|');
        const block = pk.slice(0, idx), instance = pk.slice(idx + 1);
        const fieldList = SYNTHETIC_BLOCKS[sheetName + '|' + block];
        const base = nextRow;
        const rowOf = {}; fieldList.forEach(([l], i) => { rowOf[l] = base + i; });
        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        // Same Annualised Hours formula Inspired use on every other controls block, re-pointed at
        // this block's own rows (weeks x sum over the week of end-start, 24h if both 00:00).
        const annualFormula = (c) => {
          const w = rowOf['Operating Weeks per Annum'];
          if (!w || days.some(dy => !rowOf[dy + ' Start Time'] || !rowOf[dy + ' End Time'])) return null;
          const parts = days.map(dy => { const st = c + rowOf[dy + ' Start Time'], en = c + rowOf[dy + ' End Time']; return `IFERROR(IF(OR(${st}="",${en}=""),0,IF(AND(${st}=0,${en}=0),24,(${en}-${st})*24*(${en}>${st}))),0)`; });
          return `_xlfn.LET(_xlpm.weeks, ${c}${w}, _xlpm.sys_hrs, _xlpm.weeks*(${parts.join('+')}), _xlpm.sys_hrs)`;
        };
        const sinfo = await getStyleInfo();
        const fd = donorStyle.F || {};
        const generalStyle = fd.general != null ? fd.general : (fd.anyF != null ? String(sinfo.derive(fd.anyF, { general: true })) : null);
        fieldList.forEach(([label, mand, note, dtype], i) => {
          const newR = base + i;
          const row = getRow(sheetData, newR, doc);
          const isLast = i === fieldList.length - 1;
          const dst = donorStyle[mand === 'M' ? 'Mandatory' : 'Optional'] || {};
          const last = donorStyle.lastRow;
          // Column A keeps its Mandatory/Optional styling (they differ); B-E borrow the block's closing-row
          // border on the last row of each new block, like every native block does.
          const styleFor = (col) => (isLast && last && last[col] != null && col !== 'A') ? last[col] : (isLast && last && col === 'A' && mand !== 'M' && last.A != null ? last.A : dst[col]);
          const setText = (col, text) => {
            const c = getCell(row, col + newR, doc);
            const s = styleFor(col);
            if (s != null) c.setAttribute('s', s);
            if (text === '') return;
            c.setAttribute('t', 'inlineStr');
            const is = doc.createElementNS(NS, 'is');
            const t = doc.createElementNS(NS, 't');
            t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
            t.textContent = text;
            is.appendChild(t);
            c.appendChild(is);
          };
          setText('A', mand === 'M' ? 'Mandatory' : 'Optional');
          setText('B', sheetName);
          setText('C', block);
          setText('D', label);
          setText('E', note);
          // Every entry column (F, G, H, ... one per occurrence of the service) gets a style matching this
          // field's declared type: time fields a time format, formula rows the template's calculated-cell
          // style, everything else General (so 12.5 shows as 12.5 - never as a time/date).
          const valStyle = dtype === 'time' ? fd.time : (dtype === 'formula' ? (last && last.F != null ? last.F : generalStyle) : generalStyle);
          for (let entryN = 1; entryN <= maxEntry; entryN++) {
            const cl = colLetter(5 + entryN);
            const vc = getCell(row, cl + newR, doc);
            if (valStyle != null) vc.setAttribute('s', valStyle);
            if (dtype === 'formula') {
              const f = annualFormula(cl);
              if (f) { const fe = doc.createElementNS(NS, 'f'); fe.textContent = f; vc.appendChild(fe); }
            }
          }
          if (dtype !== 'formula') synthRedirect[sheetName + '|' + block + '|' + instance + '|' + label] = newR;
        });
        nextRow = base + fieldList.length + 1;
        notes.push(`${sheetName}: added '${block}' entry ${instance} as new rows ${base}-${base + fieldList.length - 1} at the bottom of the sheet (not present in the original blank workbook)`);
      }
    }

    const cells = new Map();
    for (const r of rows) {
      const synthRow = synthRedirect[r.Sheet + '|' + r.Block + '|' + r.Instance + '|' + r.Field];
      if (synthRow != null) {
        const col = colLetter(5 + (Number(r.Entry) || 1));
        const [kind, val] = convertCell(r.Type, r.Value);
        cells.set(`${r.Sheet}|${col}|${synthRow}`, [kind, val]);
        continue;
      }
      if (!hasVal(r.Row)) {
        if (hasVal(r.Value) && r.Field !== 'Not applicable to this site') notes.push(`No workbook cell for: ${r.Sheet} / ${r.Field}`);
        continue;
      }
      const sheet = r.Sheet;
      if (!paths[sheet]) { notes.push(`Sheet not found in workbook: ${sheet}`); continue; }
      const col = sheet === 'General' ? 'F' : colLetter(5 + (Number(r.Entry) || 1));
      const origRow = Number(r.Row);
      const redirected = sheet === 'General' ? rowRedirect[r.Block + '|' + r.Instance + '|' + origRow] : null;
      const [kind, val] = convertCell(r.Type, r.Value);
      if (redirected) { cells.set(`${sheet}|${col}|${redirected}`, [kind, val]); continue; }

      const sheetData = trees[sheet].getElementsByTagNameNS(NS, 'sheetData')[0];
      const row1 = Array.from(sheetData.getElementsByTagNameNS(NS, 'row')).find(rw => parseInt(rw.getAttribute('r'), 10) === 1);
      const exists = row1 && Array.from(row1.getElementsByTagNameNS(NS, 'c')).some(c => c.getAttribute('r') === col + '1');

    }
    if (missingCols.size && !opts.force) {
      return { ok: false, missingCols: Array.from(missingCols), notes };
    }

    const sinfoW = await getStyleInfo();
    const written = {};
    for (const [key, pair] of cells) {
      const [sheet, col, rownStr] = key.split('|');
      const rown = Number(rownStr);
      const kind = pair[0], val = pair[1];
      const doc = trees[sheet];
      const sheetData = doc.getElementsByTagNameNS(NS, 'sheetData')[0];

      const cell = getCell(row, col + rown, doc);
      if (cell.getElementsByTagNameNS(NS, 'f').length) { notes.push(`${sheet} ${col}${rown} holds a formula - left alone`); continue; }
      // A brand-new cell (e.g. a column the Setup macro hasn't styled) inherits column F's style on that row.
      if (cell.getAttribute('s') == null) {
        const fc = Array.from(row.getElementsByTagNameNS(NS, 'c')).find(c => c.getAttribute('r') === 'F' + rown);
        if (fc && fc.getAttribute('s') != null) cell.setAttribute('s', fc.getAttribute('s'));
      }
      while (cell.firstChild) cell.removeChild(cell.firstChild);
      if (kind === 'n') {
        cell.removeAttribute('t');
        const v = doc.createElementNS(NS, 'v');
        // Percentage-formatted cells (e.g. Small Power 'Level of service (%)') store 0.5 for 50%; the app
        // holds the figure as typed (50), so convert - otherwise it shows as 5000%.
        const sIdx = cell.getAttribute('s');

        if (String(val).length > 28) {
          // Excel does not re-autofit rows on open, so set an explicit height that fits the wrapped text
          // (estimated from the column width); never shrink below the template's own height.
          const cn = colNum(col);
          let wch = 9;
          Array.from(doc.getElementsByTagNameNS(NS, 'col')).forEach(cd => { if (cn >= +cd.getAttribute('min') && cn <= +cd.getAttribute('max') && cd.getAttribute('width')) wch = +cd.getAttribute('width'); });
          const perLine = Math.max(8, Math.floor(wch * 1.05));
          const lines = String(val).split(/\r?\n/).reduce((n, ln) => n + Math.max(1, Math.ceil(ln.length / perLine)), 0);
          const need = Math.min(409, lines * 15 + 3);
          const cur = parseFloat(row.getAttribute('ht') || '0');
          if (need > cur) { row.setAttribute('ht', String(need)); row.setAttribute('customHeight', '1'); }
        }
        cell.setAttribute('t', 'inlineStr');
        const is = doc.createElementNS(NS, 'is');
        const t = doc.createElementNS(NS, 't');
        t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
        t.textContent = String(val);
        is.appendChild(t);
        cell.appendChild(is);
      }
      written[sheet] = (written[sheet] || 0) + 1;
    }

    // ---- workbook-wide tidy of the value columns (F, G, H, ... on every data tab) ----
    // (a) a numeric row (kW load, power, counts, hours ...) must not carry a time-of-day number format,
    //     or a number like 12.5 shows as a time; time rows (Start/End Time, '24-hour format') keep theirs.
    // (b) value cells are centred and wrapped, including extra entry columns the Setup macro adds.
    {
      const sinfo = await getStyleInfo();
      const sst = await getSharedStrings();
      const DATA_TABS = ['General', 'Heating', 'DHW', 'Cooling', 'Ventilation', 'Lighting', 'Process', 'Catering', 'Leisure', 'Small Power', 'Other'];
      for (const tab of DATA_TABS) {
        if (!paths[tab]) continue;
        if (!trees[tab]) trees[tab] = await readXml(paths[tab]);
        const sd = trees[tab].getElementsByTagNameNS(NS, 'sheetData')[0];
        for (const row of Array.from(sd.getElementsByTagNameNS(NS, 'row'))) {
          if (parseInt(row.getAttribute('r'), 10) < 2) continue;
          const cs = Array.from(row.getElementsByTagNameNS(NS, 'c'));

          const isTimeRow = /time|24-hour|hh:mm/i.test(txtOf('D') + ' ' + txtOf('E'));
          for (const c of cs) {
            if (colNum(c.getAttribute('r').match(/^[A-Z]+/)[0]) < 6) continue;
            const s = c.getAttribute('s'); if (s == null) continue;
            const ns = sinfo.derive(s, { general: !isTimeRow, centre: true });
            if (String(ns) !== s) c.setAttribute('s', String(ns));
          }
        }
      }
    }

    Object.values(trees).forEach(doc => updateDimension(doc));
    const calcPr = wbDoc.getElementsByTagNameNS(NS, 'calcPr')[0];
    if (calcPr) calcPr.setAttribute('fullCalcOnLoad', '1');

    const outZip = new JSZip();
    const pathToSheet = {}; Object.entries(paths).forEach(([s, p]) => { pathToSheet[p] = s; });
    const fileNames = Object.keys(zin.files);
    for (const name of fileNames) {
      const entry = zin.files[name];
      if (entry.dir) continue;
      if (name === 'xl/workbook.xml') {
        outZip.file(name, serializer.serializeToString(wbDoc));
      } else if (name === 'xl/styles.xml' && styleCache && styleCache.modified) {
        outZip.file(name, serializer.serializeToString(styleCache.doc));
      } else if (pathToSheet[name] && trees[pathToSheet[name]]) {
        outZip.file(name, serializer.serializeToString(trees[pathToSheet[name]]));
      } else {
        const bytes = await entry.async('uint8array');
        outZip.file(name, bytes, { binary: true });
      }
    }
    const blob = await outZip.generateAsync({ type: opts.outputType || 'nodebuffer' });
    return { ok: true, blob, notes, written };
  }

  function planNumbers(rows) {
    const zones = rows.filter(r => r.Block === 'Zones').length;
    const per = {};
    rows.forEach(r => { if (r.Sheet !== 'General' && hasVal(r.Entry)) per[r.Sheet] = Math.max(per[r.Sheet] || 0, Number(r.Entry)); });
    const mx = Object.values(per).length ? Math.max(...Object.values(per)) : 1;

  }

  return { fillWorkbook, planNumbers, colLetter, colNum };
}

function makeOnsiteEngine({ JSZip, DOMParser, XMLSerializer }) {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const SHEETS = ['General', 'Heating', 'DHW', 'Cooling', 'Ventilation', 'Lighting', 'Process', 'Catering', 'Leisure', 'Small Power', 'Other'];

  async function readXml(zip, path) {

    const sst = await sharedStrings(zip), fmtOf = await styleFormats(zip);
    const sheets = {};
    for (const n of SHEETS) if (paths[n]) sheets[n] = await readSheet(zip, paths[n], sst, fmtOf);
    if (!sheets.General) throw new Error('This does not look like the Inspired Site Data Collection workbook (no "General" sheet).');
    const gv = valueOf(sheets.General, 'F3');
    const siteName = gv ? String(gv.v) : '';
    let maxCols = 0, headerSheet = null;
    for (const n of SHEETS) { const s = sheets[n]; if (s && s.maxC > maxCols) { maxCols = s.maxC; headerSheet = s; } } // strict > : first widest wins
    const hdr = [{ t: 's', v: 'Site Name', fmt: 'General' }];
    for (let c = headerSheet.minC; c <= headerSheet.maxC; c++) hdr.push(valueOf(headerSheet, colLetter(c) + '1'));
    const W = hdr.length, rows = [];
    for (const n of SHEETS) {
      const s = sheets[n]; if (!s) continue;
      for (let r = 2; r <= s.maxR; r++) {
        const row = [{ t: 's', v: siteName, fmt: 'General' }];
        for (let c = s.minC; c <= s.maxC; c++) row.push(valueOf(s, colLetter(c) + r));
        while (row.length < W) row.push(null);
        row.length = W;
        const blank = (x) => x === null || x.v === '' ;
        if (blank(row[2]) && blank(row[3])) continue; // macro deletes rows with no Status and no System Name
        rows.push(row);
      }
    }
    return { header: hdr, rows, siteName };
  }

  // === 2. Expand_Onsite_Zones ===
  const pad = (n) => String(n).padStart(2, '0');
  function cstr(x) { // VBA CStr() of a cell value, as the macro sees it
    if (x === null || x === undefined) return '';
    if (x.t === 's') return String(x.v);
    const k = kindOfFmt(x.fmt);
    if (k === 'time') { const s = Math.round((x.v % 1) * 86400); return pad(Math.floor(s / 3600) % 24) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
    if (k === 'date') { const d = new Date(Math.round((x.v - 25569) * 86400000)); return pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); }
    return String(Math.round(x.v * 1e12) / 1e12);
  }
  const clean = (x) => { let s = cstr(x).replace(/^ +| +$/g, ''); while (s.includes('  ')) s = s.replace(/  /g, ' '); return s; };
  const esoSheet = (s) => s === 'Heating' ? 'ESO-8' : s === 'Lighting' ? 'ESO-7' : 'No Destination';

  function expandZones(header, rows) {
    let fz = 0;
    for (let c = 0; c < header.length; c++) { const h = clean(header[c]).toLowerCase(); if (h.includes('field') && h.includes('population')) { fz = c; break; } }
    if (!header.length || (!/field/i.test(clean(header[fz])))) throw new Error('Could not find a "Fields For Population" header in the Master Output.');
    let lastCol = header.length; // macro uses the last used column of the sheet
    while (lastCol > fz + 1 && rows.every(r => r[lastCol - 1] == null || r[lastCol - 1].v === '') && clean(header[lastCol - 1]) === '') lastCol--;
    const mz = lastCol - fz;
    let zn = new Array(mz + 1).fill(''), zc = 0, cur = ''; const out = [];
    for (const r of rows) {
      const status = clean(r[1]), sys = clean(r[2]), desc = clean(r[4]);
      if (sys && sys !== cur) { cur = sys; zn = new Array(mz + 1).fill(''); zc = 0; }
      if (desc === 'Zone') { zc = 0; for (let z = 1; z <= mz; z++) { const v = clean(r[fz + z - 1]); zn[z] = v; if (v) zc++; } continue; }
      if (status.toLowerCase() !== 'mandatory') continue;
      const site = clean(r[0]), title = clean(r[3]);
      if (!title && !desc) continue;
      const eso = esoSheet(cur);
      if (zc === 0) out.push([site, status, sys, title, desc, '', '', eso]);
      else for (let z = 1; z <= zc; z++) { const v = clean(r[fz + z - 1]); if (v) out.push([site, status, sys, title, desc, zn[z], v, eso]); }
    }
    return out;
  }

  // Site names the tool knows about (Portfolio tab, "Site Name" column). Onsite data only links to the
  // rate/consumption lookups when its site name matches one of these exactly.
  async function portfolioSites(estBuf) {
    const zip = await JSZip.loadAsync(estBuf);
    const { paths } = await sheetPaths(zip);
    if (!paths['Portfolio']) return [];
    const sst = await sharedStrings(zip), fmtOf = await styleFormats(zip);
    const sh = await readSheet(zip, paths['Portfolio'], sst, fmtOf);
    let col = 0;
    for (let c = sh.minC; c <= sh.maxC; c++) { const h = valueOf(sh, colLetter(c) + '1'); if (h && /^site name$/i.test(String(h.v).trim())) { col = c; break; } }
    if (!col) return [];
    const seen = [], set = new Set();
    for (let r = 2; r <= sh.maxR; r++) { const x = valueOf(sh, colLetter(col) + r); const n = x ? String(x.v).replace(/\s+/g, ' ').trim() : ''; if (n && !set.has(n)) { set.add(n); seen.push(n); } }
    return seen;
  }
  const ESO8_KEYS = new Set(['fuel', 'type', 'boiler input power kw', 'input power kw', 'heater electrical power kw', 'boiler output power kw', 'output power kw', 'number boilers', 'number', 'number of heaters', 'quantity', 'quantity of boilers', 'approximate age years', 'approximate age', 'annualised hours']);
  const ESO7_KEYS = new Set(['type of lamp', 'lamp type', 'lamps per luminaire', 'wattage per lamp w', 'no of luminaires', 'number of luminaires', 'annualised hours', 'annual operating hours']);
  const normDesc = (d) => String(d).trim().toLowerCase().replace(/[.()]/g, '').replace(/ {2,}/g, ' ');
  function normTitle(t) {
    t = String(t).trim(); const m = /^controls system (\d+)$/i.exec(t); if (m) return 'Wet / Radiant System ' + m[1];
    if (t.toLowerCase() === 'electric system - controls') return 'Electric System'; return t;
  }
  // How many rows BuildESO7 / BuildESO8 would write (upper estimate). ESO-7 and ESO-8 only have formulas on rows 6-40.
  function esoRowEstimate(expanded) {
    const g7 = new Set(), g8 = new Set();
    for (const r of expanded) {
      const [site, , , title, desc, zone, , eso] = r;
      if (eso === 'ESO-7' && /^Type of Lighting/.test(title) && ESO7_KEYS.has(normDesc(desc))) g7.add(site + '||' + zone + '||' + title);
      if (eso === 'ESO-8') { const nt = normTitle(title); if (nt === 'Electric System' || ESO8_KEYS.has(normDesc(desc))) g8.add(site + '||' + zone + '||' + nt); }
    }
    return { eso7: g7.size, eso8: g8.size, capacity: 35 };
  }

  // === 3. write into the Energy Survey Tool ===
  async function fillSurveyTool(estBuf, master, opts) {
    opts = opts || {};
    const zip = await JSZip.loadAsync(estBuf);
    const { wbDoc, paths } = await sheetPaths(zip);
    const inPath = paths['Input Onsite Data'], outPath = paths['Output Onsite Data'];
    if (!inPath || !outPath) throw new Error('This does not look like the Inspired Energy Survey Tool (no Input/Output Onsite Data sheets).');
    const siteName = opts.siteName != null && opts.siteName !== '' ? String(opts.siteName) : master.siteName;
    const newRows = master.rows.map(r => { const x = r.slice(); x[0] = { t: 's', v: siteName, fmt: 'General' }; return x; });
    // Several sites: Inspired's instruction is to paste each site's Master Output into Input Onsite Data one below another.
    // Existing sites already in the tool are kept; the same site run again is replaced rather than duplicated.
    let header = master.header.slice(), keptRows = [], replacedRows = 0;
    if (!opts.replaceAll) {
      const sst0 = await sharedStrings(zip), fmtOf0 = await styleFormats(zip);
      const ex = await readSheet(zip, inPath, sst0, fmtOf0);
      if (ex.maxR >= 2) {
        const exHdr = []; for (let c = 1; c <= ex.maxC; c++) exHdr.push(valueOf(ex, colLetter(c) + '1'));
        const norm = (x) => clean(x).toLowerCase();
        if (exHdr.length > header.length) { for (let c = header.length; c < exHdr.length; c++) header.push(exHdr[c]); }
        for (let r = 2; r <= ex.maxR; r++) {
          const row = []; for (let c = 1; c <= ex.maxC; c++) row.push(valueOf(ex, colLetter(c) + r));
          if (!row[0] || clean(row[0]) === '') continue;
          if (norm(row[0]) === norm({ t: 's', v: siteName })) { replacedRows++; continue; }
          keptRows.push(row);
        }
      }
    }
    const W = header.length;
    const rows = keptRows.concat(newRows).map(r => { const x = r.slice(); while (x.length < W) x.push(null); x.length = W; return x; });
    const expanded = expandZones(header, rows);
    const sites = []; rows.forEach(r => { const n = clean(r[0]); if (n && !sites.includes(n)) sites.push(n); });
    const portfolio = await portfolioSites(estBuf);
    const inPortfolio = portfolio.length ? portfolio.includes(clean({ t: 's', v: siteName })) : null;
    const eso = esoRowEstimate(expanded);

    // --- styles: append number-format xfs we need
    const stDoc = await readXml(zip, 'xl/styles.xml');
    const numFmts = first(stDoc.documentElement, 'numFmts');
    const cx = first(stDoc.documentElement, 'cellXfs');
    const codeToId = {}; Object.keys(BUILTIN).forEach(id => { if (!(BUILTIN[id] in codeToId)) codeToId[BUILTIN[id]] = +id; });
    let maxId = 163;
    if (numFmts) Array.from(numFmts.childNodes).filter(n => n.nodeType === 1).forEach(n => { const id = +n.getAttribute('numFmtId'); codeToId[n.getAttribute('formatCode')] = id; maxId = Math.max(maxId, id); });
    const xfCache = {};
    const styleFor = (code) => {
      code = code || 'General';
      if (code === 'General') return 0;
      if (xfCache[code] != null) return xfCache[code];
      let id = codeToId[code];
      if (id == null) {
        id = ++maxId; codeToId[code] = id;
        let nf = numFmts; if (!nf) { nf = stDoc.createElementNS(NS, 'numFmts'); stDoc.documentElement.insertBefore(nf, stDoc.documentElement.firstChild); }
        const e = stDoc.createElementNS(NS, 'numFmt'); e.setAttribute('numFmtId', id); e.setAttribute('formatCode', code); nf.appendChild(e);
        nf.setAttribute('count', Array.from(nf.childNodes).filter(n => n.nodeType === 1).length);
      }
      const xf = stDoc.createElementNS(NS, 'xf');
      xf.setAttribute('numFmtId', id); xf.setAttribute('fontId', '0'); xf.setAttribute('fillId', '0'); xf.setAttribute('borderId', '0'); xf.setAttribute('xfId', '0'); xf.setAttribute('applyNumberFormat', '1');
      cx.appendChild(xf);
      const n = kids(cx, 'xf').length; cx.setAttribute('count', n);
      return (xfCache[code] = n - 1);
    };

    function rowEl(sd, doc, n) {
      let prev = null;
      for (const r of kids(sd, 'row')) { const rn = +r.getAttribute('r'); if (rn === n) return r; if (rn > n) { prev = r; break; } }
      const el = doc.createElementNS(NS, 'row'); el.setAttribute('r', n);
      if (prev) sd.insertBefore(el, prev); else sd.appendChild(el);
      return el;
    }
    function cellEl(row, doc, ref) {
      const cn = splitRef(ref)[0]; let prev = null;
      for (const c of kids(row, 'c')) { const k = splitRef(c.getAttribute('r'))[0]; if (k === cn) return c; if (k > cn) { prev = c; break; } }
      const el = doc.createElementNS(NS, 'c'); el.setAttribute('r', ref);
      if (prev) row.insertBefore(el, prev); else row.appendChild(el);
      return el;
    }
    function clearCell(c) { Array.from(c.childNodes).forEach(n => c.removeChild(n)); c.removeAttribute('t'); }
    function setCell(sd, doc, ref, x, keepStyle) {
      const c = cellEl(rowEl(sd, doc, splitRef(ref)[1]), doc, ref);
      clearCell(c);
      if (x === null || x === undefined || x === '' || (x.v !== undefined && (x.v === '' || x.v === null))) { return c; }
      if (typeof x === 'string' || x.t === 's') {
        const s = typeof x === 'string' ? x : String(x.v);
        c.setAttribute('t', 'inlineStr');
        const is = doc.createElementNS(NS, 'is'), t = doc.createElementNS(NS, 't');
        t.setAttribute('xml:space', 'preserve'); t.textContent = s; is.appendChild(t); c.appendChild(is);
        if (!keepStyle) c.removeAttribute('s');
      } else {
        const v = doc.createElementNS(NS, 'v'); v.textContent = String(x.v); c.appendChild(v);
        if (!keepStyle) { const st = styleFor(x.fmt); if (st) c.setAttribute('s', st); else c.removeAttribute('s'); }
      }
      return c;
    }
    const setDimension = (doc, maxC, maxR) => { const d = doc.getElementsByTagNameNS(NS, 'dimension')[0]; if (d) d.setAttribute('ref', 'A1:' + colLetter(Math.max(maxC, 1)) + Math.max(maxR, 1)); };
    const clearFrom2 = (sd) => kids(sd, 'row').forEach(r => { if (+r.getAttribute('r') >= 2) sd.removeChild(r); });

    // Input Onsite Data: header + master rows (values; number formats carried over, like the paste does)
    const inDoc = await readXml(zip, inPath), inSd = first(inDoc.documentElement, 'sheetData');
    clearFrom2(inSd);
    header.forEach((h, i) => { setCell(inSd, inDoc, colLetter(i + 1) + '1', h && h.v !== null ? { t: 's', v: h.v } : null, true); });
    rows.forEach((r, ri) => r.forEach((x, ci) => { if (x) setCell(inSd, inDoc, colLetter(ci + 1) + (ri + 2), x); }));
    setDimension(inDoc, header.length, rows.length + 1);
    // Output Onsite Data: ClearContents from row 2 (keeps formats), then the 8 expanded columns
    const outDoc = await readXml(zip, outPath), outSd = first(outDoc.documentElement, 'sheetData');
    kids(outSd, 'row').forEach(r => { if (+r.getAttribute('r') >= 2) kids(r, 'c').forEach(clearCell); });
    // Excel turns a plain number written from VBA as text ("63") into a number; do the same so downstream formulas see numbers.
    // (Excel also turns things like "5-7" into a date; that is deliberately NOT copied - it stays as text.)
    const isPlainNum = (v) => /^-?(0|[1-9]\d*)(\.\d+)?$/.test(v) && Math.abs(parseFloat(v)) < 1e15;
    expanded.forEach((r, ri) => r.forEach((v, ci) => { if (v !== '') setCell(outSd, outDoc, colLetter(ci + 1) + (ri + 2), (ci === 6 && isPlainNum(v)) ? { t: 'n', v: parseFloat(v), fmt: 'General' } : { t: 's', v }, true); }));

    // Overview tab: surveyor + Lead Assessor details, only where the cell is empty
    let overviewFilled = 0, surveyStartSet = false;
    if (paths['Overview']) {
      const ovDoc = await readXml(zip, paths['Overview']), ovSd = first(ovDoc.documentElement, 'sheetData');
      for (const [ref, val] of OVERVIEW_DEFAULTS) {
        const c = cellEl(rowEl(ovSd, ovDoc, splitRef(ref)[1]), ovDoc, ref);
        const v = c.getElementsByTagNameNS(NS, 'v')[0], is = c.getElementsByTagNameNS(NS, 'is')[0], f = c.getElementsByTagNameNS(NS, 'f')[0];
        if (f || is || (v && v.textContent !== '')) continue;
        setCell(ovSd, ovDoc, ref, { t: 's', v: val, fmt: 'General' }, true); overviewFilled++;
      }
      // Survey Start Date (B2): written only when a date is given, replacing whatever is there
      if (opts && /^\d{4}-\d{2}-\d{2}$/.test(opts.surveyStart || '')) {
        const [yy, mm, dd] = opts.surveyStart.split('-').map(Number);
        setCell(ovSd, ovDoc, 'B2', { t: 'n', v: Math.round(Date.UTC(yy, mm - 1, dd) / 86400000) + 25569, fmt: 'General' }, true); surveyStartSet = true;
      }
      zip.file(paths['Overview'], serializer.serializeToString(ovDoc));
    }

    // Ask Excel to recalculate everything the first time the file is opened
    const calc = wbDoc.getElementsByTagNameNS(NS, 'calcPr')[0];
    if (calc) calc.setAttribute('fullCalcOnLoad', '1');

    zip.file(inPath, serializer.serializeToString(inDoc));
    zip.file(outPath, serializer.serializeToString(outDoc));
    zip.file('xl/styles.xml', serializer.serializeToString(stDoc));
    zip.file('xl/workbook.xml', serializer.serializeToString(wbDoc));
    const blob = await zip.generateAsync({ type: opts.outputType === 'uint8array' ? 'uint8array' : 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.ms-excel.sheet.macroEnabled.12' });
    return { blob, inputRows: rows.length, outputRows: expanded.length, siteName, master, expanded, sites, replacedRows, newRows: newRows.length, portfolio, inPortfolio, eso, overviewFilled, surveyStartSet };
  }

  // === 4. QA checklist pre-fill (Inspired "Energy Site Surveys QA Checklist": the "Energy Assessor" rows) ===
  // Same rules as qa_prefill.py, tested against Inspired's completed Key Retirement checklist (93 of 93 filled rows identical).
  const QA_SECTION_TAB = { 'General Tab': 'General', 'Heating Tab': 'Heating', 'Domestic Hot Water (DHW) Tab': 'DHW', 'Cooling Tab': 'Cooling', 'Ventilation Tab': 'Ventilation', 'Lighting Tab': 'Lighting', 'Process Tab': 'Process', 'Catering Tab': 'Catering', 'Leisure Tab': 'Leisure', 'Small Power Tab': 'Small Power', 'Other Tab': 'Other' };
  const QA_COMMON = new Set(['General and Structure', 'Controls & Operation']);
  const QA_MANUAL = new Set(['Evidence Pack', 'Energy Saving Opportunities (ESOs)']);
  const isBlank = (v) => v === null || v === undefined || (typeof v === 'string' && v.trim() === '');
  const hasEntry = (x) => !!x && !isBlank(x.v) && !(x.t === 'n' && x.v === 0); // a bare 0 (e.g. Annualised Hours of an unused block) is not an entry
  const txt = (sh, ref) => { const c = sh && sh.cells.get(ref); return c && !isBlank(c.v) ? String(c.v) : null; };
  const serialOf = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
  function dateSerial(x) { // an Excel serial, or "dd/mm/yyyy" / "yyyy-mm-dd" text
    if (!x) return null;
    if (x.t === 'n' && x.v > 20000) return Math.floor(x.v);
    const s = String(x.v).trim(); let m;
    if ((m = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/.exec(s))) return serialOf(+m[3], +m[2], +m[1]);
    if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return serialOf(+m[1], +m[2], +m[3]);
    return null;
  }

  async function qaReadSdc(buf, fileName) {
    const zip = await JSZip.loadAsync(buf);
    const { paths } = await sheetPaths(zip);
    if (!paths['General']) throw new Error('"' + fileName + '" does not look like the Inspired Site Data Collection workbook (no "General" sheet).');
    const sst = await sharedStrings(zip), fmtOf = await styleFormats(zip);
    const info = { file: fileName, tabs: {}, masterRows: 0, zones: null, surveyDate: null, site: null };
    const gen = await readSheet(zip, paths['General'], sst, fmtOf);
    for (let r = 2; r <= gen.maxR; r++) {
      const label = txt(gen, 'D' + r);
      if (label === 'Site Name') { const v = valueOf(gen, 'F' + r); info.site = v ? String(v.v) : null; }
      if (label === 'Survey Date') info.surveyDate = dateSerial(valueOf(gen, 'F' + r));
    }
    if (paths['Setup']) {
      const s = await readSheet(zip, paths['Setup'], sst, fmtOf);
      for (let r = 1; r < 30 && info.zones === null; r++) {
        let isZ = false; for (let c = 1; c <= 5; c++) if ((txt(s, colLetter(c) + r) || '').trim() === 'Number of Zones') isZ = true;
        if (!isZ) continue;
        for (let c = 1; c <= 7; c++) { const v = valueOf(s, colLetter(c) + r); if (v && v.t === 'n' && v.v > 0) { info.zones = Math.floor(v.v); break; } if (v && /^\d+$/.test(String(v.v).trim())) { info.zones = +String(v.v).trim(); break; } }
      }
    }
    if (paths['Master Output']) {
      const mo = await readSheet(zip, paths['Master Output'], sst, fmtOf); const rowsSeen = new Set();
      mo.cells.forEach((c, ref) => { const rn = splitRef(ref)[1]; if (rn >= 2 && !isBlank(c.v)) rowsSeen.add(rn); });
      info.masterRows = rowsSeen.size;
    }
    for (const n of SHEETS) {
      if (!paths[n]) continue;
      const sh = await readSheet(zip, paths[n], sst, fmtOf);
      let mand = 0, filled = 0; const blocks = new Map();
      for (let r = 2; r <= sh.maxR; r++) {
        const st = valueOf(sh, 'A' + r), sysn = valueOf(sh, 'B' + r);
        if (isBlank(st && st.v) && isBlank(sysn && sysn.v)) continue;
        let any = false; for (let c = 6; c <= sh.maxC && !any; c++) any = hasEntry(valueOf(sh, colLetter(c) + r));
        const title = txt(sh, 'C' + r) || '';
        const key = (sysn && !isBlank(sysn.v) ? String(sysn.v).trim() : '') + '\u0001' + title.trim();
        if (!blocks.has(key)) blocks.set(key, { any: false, gaps: [] });
        const blk = blocks.get(key); if (any) blk.any = true;
        if (String(st ? st.v : '').trim().toLowerCase() !== 'mandatory') continue;
        mand++; if (any) filled++; else blk.gaps.push({ row: r, title: txt(sh, 'C' + r) || (sysn ? String(sysn.v) : ''), desc: txt(sh, 'D' + r) || '' });
      }
      const gaps = []; blocks.forEach(b => { if (b.any) b.gaps.forEach(g => gaps.push(g)); });
      info.tabs[n] = { mandatory: mand, filled, gaps };
    }
    return info;
  }

  async function qaReadTool(buf) {
    const zip = await JSZip.loadAsync(buf);
    const { paths } = await sheetPaths(zip);
    const sst = await sharedStrings(zip), fmtOf = await styleFormats(zip);
    const out = { overview: {}, eso: {} };
    if (paths['Overview']) {
      const o = await readSheet(zip, paths['Overview'], sst, fmtOf);
      for (let r = 1; r < 60; r++) { const k = txt(o, 'A' + r); if (k) out.overview[k.trim()] = valueOf(o, 'B' + r); }
    }
    for (const name of Object.keys(paths)) {
      const m = /^ESO-(\d+)$/.exec(name); if (!m) continue;
      const sh = await readSheet(zip, paths[name], sst, fmtOf); let n = 0;
      for (let r = 6; r <= sh.maxR; r++) { const v = txt(sh, 'D' + r); if (v && v.trim() !== 'No Data') n++; }
      out.eso[+m[1]] = n;
    }
    return out;
  }

  // sdcList: [{buf, name}], toolBuf (optional), opts: { name, date: 'YYYY-MM-DD', signFlagged }
  async function fillQaChecklist(chkBuf, sdcList, toolBuf, opts) {
    opts = opts || {};
    const who = (opts.name || '').trim() || 'Prashant Vara';
    const dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(opts.date || '');
    const now = new Date(), when = dm ? serialOf(+dm[1], +dm[2], +dm[3]) : serialOf(now.getFullYear(), now.getMonth() + 1, now.getDate());
    const sdcs = []; for (const s of sdcList) sdcs.push(await qaReadSdc(s.buf, s.name));
    const est = toolBuf ? await qaReadTool(toolBuf) : null;
    const zip = await JSZip.loadAsync(chkBuf);
    const { wbDoc, paths } = await sheetPaths(zip);
    const SH = 'Site_Data_Collection_Template', DL = 'ESOS Energy Audit Delivery', ES = 'Energy_Survey_Tool';
    if (!paths[SH]) throw new Error('This does not look like the Inspired Energy Site Surveys QA Checklist (no "' + SH + '" sheet).');
    const sst = await sharedStrings(zip), fmtOf = await styleFormats(zip);
    const docs = {}, shs = {};
    for (const n of [SH, DL, ES]) if (paths[n]) { docs[n] = await readXml(zip, paths[n]); shs[n] = await readSheet(zip, paths[n], sst, fmtOf); }

    function rowEl(doc, n) {
      const sd = first(doc.documentElement, 'sheetData'); let prev = null;
      for (const r of kids(sd, 'row')) { const rn = +r.getAttribute('r'); if (rn === n) return r; if (rn > n) { prev = r; break; } }
      const el = doc.createElementNS(NS, 'row'); el.setAttribute('r', n); if (prev) sd.insertBefore(el, prev); else sd.appendChild(el); return el;
    }
    function cellEl(doc, ref) {
      const row = rowEl(doc, splitRef(ref)[1]), cn = splitRef(ref)[0]; let prev = null;
      for (const c of kids(row, 'c')) { const k = splitRef(c.getAttribute('r'))[0]; if (k === cn) return c; if (k > cn) { prev = c; break; } }
      const el = doc.createElementNS(NS, 'c'); el.setAttribute('r', ref); if (prev) row.insertBefore(el, prev); else row.appendChild(el); return el;
    }
    const clear = (c) => { Array.from(c.childNodes).forEach(n => c.removeChild(n)); c.removeAttribute('t'); };
    const setText = (sheet, ref, s) => { const c = cellEl(docs[sheet], ref); clear(c); c.setAttribute('t', 'inlineStr'); const is = docs[sheet].createElementNS(NS, 'is'), t = docs[sheet].createElementNS(NS, 't'); t.setAttribute('xml:space', 'preserve'); t.textContent = s; is.appendChild(t); c.appendChild(is); };
    const setDate = (sheet, ref, serial) => { const c = cellEl(docs[sheet], ref); clear(c); const v = docs[sheet].createElementNS(NS, 'v'); v.textContent = String(serial); c.appendChild(v); return c; };
    const T = (sheet, ref) => txt(shs[sheet], ref);

    // tab status across all sites
    const status = {};
    for (const n of SHEETS) {
      const used = sdcs.some(s => s.tabs[n] && s.tabs[n].filled > 0);
      const gaps = used ? sdcs.flatMap(s => ((s.tabs[n] && s.tabs[n].gaps) || []).map(g => ({ site: s.site || s.file, ...g }))) : [];
      status[n] = { state: used ? (gaps.length ? 'used_gaps' : 'used_clean') : 'na', gaps };
    }
    const allClean = SHEETS.every(n => status[n].state !== 'used_gaps');
    const res = { signed: 0, na: 0, left: [], tabs: status, estLeft: [], sites: sdcs.map(s => s.site || s.file), notes: [] };

    // --- Site_Data_Collection_Template sheet
    let cur = null;
    for (let r = 5; r <= shs[SH].maxR; r++) {
      const who_ = T(SH, 'E' + r), b = T(SH, 'B' + r), c = T(SH, 'C' + r), d = T(SH, 'D' + r);
      if (c) cur = c.trim(); else if (b) cur = b.trim();
      if (who_ !== 'Energy Assessor' || !d) continue;
      const short = d.replace(/\n/g, ' ').slice(0, 90);
      let sign = false, na = false, why = '';
      if (QA_SECTION_TAB[cur]) {
        const st = status[QA_SECTION_TAB[cur]];
        if (st.state === 'na') na = true;
        else if (st.state === 'used_clean' || opts.signFlagged) sign = true;
        else why = st.gaps.length + ' Mandatory field(s) blank on the ' + QA_SECTION_TAB[cur] + ' tab';
      } else if (cur === 'Setup') { sign = sdcs.every(s => s.zones); why = sign ? '' : 'Number of Zones on the Setup tab is blank'; }
      else if (cur === 'File Checks') {
        if (r === 5 || !d.includes('saved in line')) sign = true;
        else {
          const bad = sdcs.filter(s => !/^Inspired[_ ]ESG[_ ]ESOS[_ ]Site[_ ]Data[_ ]Collection[_ ].+FY\d\d/.test(s.file.replace(/^[0-9a-f]{8}-/, '').replace(/ /g, '_')));
          sign = !bad.length; why = sign ? '' : 'file name does not follow the Inspired naming: ' + bad.map(s => s.file).join(', ');
        }
      } else if (QA_COMMON.has(cur)) { sign = allClean || !!opts.signFlagged; why = sign ? '' : 'some energy-use tabs have blank Mandatory fields'; }
      else if (cur === 'Master Output Tab') {
        const hasMo = sdcs.every(s => s.masterRows > 0);
        sign = hasMo && (allClean || !!opts.signFlagged);
        why = sign ? '' : (!hasMo ? 'Master Output is empty - run the Build Master Output macro' : 'Mandatory fields still blank');
      } else if (QA_MANUAL.has(cur)) why = 'needs your own check (photos / judgement)';
      else why = 'not covered';
      if (sign || na) { setText(SH, 'F' + r, who); if (na) setText(SH, 'G' + r, 'Not Applicable'); setDate(SH, 'H' + r, when); if (na) res.na++; else res.signed++; }
      else res.left.push({ row: r, section: cur, text: short, why });
    }

    // --- Delivery sheet
    if (docs[DL]) {
      for (let r = 5; r < 14; r++) {
        const k = T(DL, 'B' + r);
        if ((k === 'Lead ESOS Assessor' || k === 'Energy Assessor') && !T(DL, 'C' + r)) setText(DL, 'C' + r, who);
        if (k === 'Energy Assessor' && !T(DL, 'D' + r)) setDate(DL, 'D' + r, when);
        if (k === 'Client Energy Audit Date' && !T(DL, 'D' + r)) {
          const ds = sdcs.map(s => s.surveyDate).filter(x => x);
          if (ds.length) { const c = setDate(DL, 'D' + r, Math.max(...ds)); const d7 = shs[DL].cells.get('D7'); const d7el = d7 ? Array.from(docs[DL].getElementsByTagNameNS(NS, 'c')).find(e => e.getAttribute('r') === 'D7') : null; if (d7el && d7el.getAttribute('s')) c.setAttribute('s', d7el.getAttribute('s')); }
        }
      }
    }

    // --- Energy_Survey_Tool sheet (needs the Survey Tool)
    if (est && docs[ES]) {
      const ov = est.overview, has = (...ks) => ks.every(k => ov[k] && !isBlank(ov[k].v));
      for (let r = 4; r <= shs[ES].maxR; r++) {
        if (T(ES, 'D' + r) !== 'Energy Assessor') continue;
        const c = (T(ES, 'C' + r) || '').replace(/\n/g, ' ');
        let sign = false, na = false, why = '';
        if (c.includes('Survey Start Date')) { sign = has('Survey Start Date', 'Report Start Date', 'Report End Date'); why = 'Survey Start / Report dates not all populated on the Overview tab'; }
        else if (c.includes("Surveyor's details")) { sign = has("Surveyor's Name", "Surveyor's Position", 'Company', 'Email'); why = "Surveyor's details incomplete on the Overview tab"; }
        else if (c.includes('Lead Assessor details')) { sign = has('Registration Number', 'Certifying Body'); why = 'Lead Assessor registration number / certifying body blank on the Overview tab'; }
        else {
          const m = /For (ESO-\d+)/.exec(c);
          if (m) { const n = +m[1].slice(4); if (n in est.eso && est.eso[n] === 0) na = true; else why = 'ESO tab has entries: needs your check'; }
          else why = 'needs your own check';
        }
        if (sign || na) { setText(ES, 'E' + r, who); if (na) setText(ES, 'F' + r, 'Not Applicable'); setDate(ES, 'G' + r, when); if (na) res.na++; else res.signed++; }
        else res.estLeft.push({ row: r, text: c.slice(0, 90), why });
      }
    } else if (!est) res.notes.push('No Energy Survey Tool was given, so the Energy_Survey_Tool sheet was not touched.');

    for (const n of Object.keys(docs)) zip.file(paths[n], serializer.serializeToString(docs[n]));
    res.blob = await zip.generateAsync({ type: opts.outputType === 'uint8array' ? 'uint8array' : 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    return res;
  }

  // Financial year of a project = the year of the Report End Date on the Energy Survey Tool's Overview tab ("FY25").
  async function toolFY(estBuf) {
    const zip = await JSZip.loadAsync(estBuf);
    const { paths } = await sheetPaths(zip);
    if (!paths['Overview']) return null;
    const sh = await readSheet(zip, paths['Overview'], await sharedStrings(zip), await styleFormats(zip));
    let end = null, start = null;
    for (let r = 1; r < 40; r++) { const k = (txt(sh, 'A' + r) || '').trim(); if (k === 'Report End Date') end = valueOf(sh, 'B' + r); if (k === 'Report Start Date') start = valueOf(sh, 'B' + r); }
    const ser = dateSerial(end) || dateSerial(start); if (!ser) return null;
    const y = new Date(Date.UTC(1899, 11, 30) + ser * 86400000).getUTCFullYear();
    return 'FY' + String(y).slice(-2);
  }

  return { masterFromSdc, expandZones, fillSurveyTool, portfolioSites, esoRowEstimate, cstr, clean, fillQaChecklist, toolFY };
}
