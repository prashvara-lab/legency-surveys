<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2C5F3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Legency Lighting">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <title>Legency Lighting Survey</title>
  <style>
    :root {
      --paper: #F3F4F2;
      --ink: #1E232A;
      --soft: #616B76;
      --line: #D6DAD6;
      --navy: #2C5F3A;
      --card: #fff;
      --grn: #2E8B57;
      --req: #B4453D;
      --amb: #E0A11B;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #171A1D;
        --ink: #E7E9E6;
        --soft: #9AA2AA;
        --line: #2E3339;
        --card: #1F2327;
        --navy: #5BA885;
      }
    }
    :root[data-theme="dark"] {
      --paper: #171A1D;
      --ink: #E7E9E6;
      --soft: #9AA2AA;
      --line: #2E3339;
      --card: #1F2327;
      --navy: #5BA885;
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: calc(env(safe-area-inset-top, 0px) + 0.75rem) 1rem 0.75rem;
    }
    .hdr-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .hdr-top > div:first-child {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }
    .hdr-top .sub {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--soft);
    }
    .themebtn {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
    }
    .crumb {
      font-size: 0.9rem;
      color: var(--soft);
    }
    main {
      padding: 1rem;
      max-width: 900px;
      margin: 0 auto 6rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }
    .note {
      font-size: 0.9rem;
      color: var(--soft);
      line-height: 1.4;
    }
    .bar {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem calc(env(safe-area-inset-bottom, 0px) + 0.75rem);
      background: var(--paper);
      border-top: 1px solid var(--line);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 15;
    }
    .bar button {
      flex: 1;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
    }
    button {
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
    }
    .pri {
      background: var(--navy);
      color: white;
    }
    .pri:active {
      opacity: 0.85;
    }
    .gh {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
    }
    .gh:active {
      background: var(--line);
    }
    .dng {
      background: transparent;
      color: var(--req);
      border: 1px solid var(--req);
      padding: 0.4rem 0.7rem;
      font-size: 0.85rem;
    }
    input, select, textarea {
      font-family: inherit;
      color: inherit;
      width: 100%;
      padding: 0.65rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      font-size: 1rem;
    }
    textarea {
      resize: vertical;
      min-height: 3.5em;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      margin: 0.9rem 0 0.3rem;
    }
    .req-mark {
      color: var(--req);
      font-weight: bold;
    }
    .fld {
      margin-bottom: 1rem;
    }
    .fld.rq label::after {
      content: ' *';
      color: var(--req);
    }
    .fld.rq input, .fld.rq select, .fld.rq textarea {
      border-color: var(--req);
      background: rgba(180, 69, 61, 0.06);
    }
    .fld.ok input, .fld.ok select, .fld.ok textarea {
      border-color: var(--grn);
      background: rgba(46, 139, 87, 0.06);
    }
    h2, h3 {
      margin: 1rem 0 0.5rem;
    }
    h2 {
      font-size: 1.2rem;
    }
    h3 {
      font-size: 1rem;
    }
    .section {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: var(--card);
    }
    .section-title {
      font-weight: 700;
      margin-bottom: 1rem;
      font-size: 1.05rem;
    }
    .site, .cust {
      cursor: pointer;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 0.8rem;
      background: var(--card);
    }
    .site:hover, .cust:hover {
      border-color: var(--navy);
      background: rgba(44, 95, 58, 0.04);
    }
    .site-name, .cust-name {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.3rem;
    }
    .site-meta, .cust-meta {
      font-size: 0.85rem;
      color: var(--soft);
    }
    .toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
      left: 1rem;
      right: 1rem;
      background: var(--navy);
      color: white;
      padding: 1rem;
      border-radius: 6px;
      display: none;
      z-index: 50;
      word-break: break-word;
      animation: slideUp 0.2s ease;
    }

    :root { color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
    :root[data-theme="dark"] { color-scheme: dark; }
    select option, select optgroup { background: var(--card); color: var(--ink); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .calcbox { padding: 0.6rem; background: rgba(46,139,87,0.12); border-radius: 6px; font-weight: 600; min-height: 2.6rem; }
    input:disabled { opacity: 0.65; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.7rem; margin-bottom: 1rem; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1rem; }
    .tile.big { border-left: 4px solid var(--navy); }
    .tile .tl { font-size: 0.78rem; color: var(--soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .tile .tv { font-size: 1.6rem; font-weight: 800; line-height: 1.2; margin-top: 0.15rem; }
    .tile .tv small { font-size: 0.85rem; font-weight: 600; color: var(--soft); }
    .tile .ts { font-size: 0.85rem; color: var(--soft); margin-top: 0.1rem; }
    .zone-name { font-weight: 700; margin-bottom: 0.4rem; word-break: break-word; }
    .zbar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 0.5rem; overflow: hidden; }
    .zbar > span { display: block; height: 100%; background: var(--navy); }

    .tabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tabs button { flex: 1; min-width: 0; }
    .tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 1rem; }
    .reftbl { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    .reftbl th { text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--soft); padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--line); }
    .reftbl td { padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    .reftbl tr:last-child td { border-bottom: none; }
    .reftbl td.n { white-space: nowrap; font-weight: 700; }
    .reftbl button { padding: 0.3rem 0.6rem; font-size: 0.8rem; white-space: nowrap; }
    .refhead { font-weight: 700; margin: 1.1rem 0 0.4rem; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(1rem); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-top">
    <div>
      <div>Legency</div>
      <div class="sub">Lighting Survey</div>
    </div>
    <button class="themebtn" id="themeBtn">⚙️</button>
  </div>
  <div class="crumb" id="crumb"></div>
</header>

<main id="main"></main>
<div class="bar" id="bar" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
// Theme
(function() {
  try {
    const t = localStorage.getItem('legency_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
function themeLabel() {
  const t = localStorage.getItem('legency_theme') || 'system';
  return t === 'system' ? '⚙️ System' : t === 'light' ? '☀️ Light' : '🌙 Dark';
}
function applyTheme(t) {
  if (t === 'system') {
    document.documentElement.removeAttribute('data-theme');
    try { localStorage.removeItem('legency_theme'); } catch (e) {}
  } else {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('legency_theme', t); } catch (e) {}
  }
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = themeLabel();
}
{
  const b = document.getElementById('themeBtn');
  if (b) {
    b.textContent = themeLabel();
    b.onclick = () => {
      const cur = localStorage.getItem('legency_theme') || 'system';
      applyTheme(cur === 'system' ? 'light' : cur === 'light' ? 'dark' : 'system');
    };
  }
}

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const esc = s => (s || '').toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast.tm);
  toast.tm = setTimeout(() => t.style.display = 'none', 3500);
}

// Firebase
const firebaseConfig = {apiKey:"AIzaSyAamu4Ljvf4xKEHbKpGGNJnphUImNjdUiY",authDomain:"esos-site-data-collection.firebaseapp.com",projectId:"esos-site-data-collection",storageBucket:"esos-site-data-collection.firebasestorage.app",messagingSenderId:"99215176778",appId:"1:99215176778:web:7bf7668890f290a618e2b3"};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let uidCur = null, fbReady = false;
let customersCol, lightingSurveysCol;

firebase.auth().onAuthStateChanged(async user => {
  if (user) {
    uidCur = user.uid;
    customersCol = db.collection('users').doc(user.uid).collection('customers');
    lightingSurveysCol = db.collection('users').doc(user.uid).collection('lightingSurveys');
    fbReady = true;
    await loadData();
    paint();
  } else {
    uidCur = null;
    fbReady = false;
    showAuthScreen();
  }
});

// State
let V = { page: 'dash' };
let cust = {};
let sites = [];
let surveys = [];

async function loadData() {
  if (!fbReady) return;
  cust = {};
  await customersCol.get().then(snap => {
    snap.forEach(doc => {
      const data = doc.data();
      cust[doc.id] = data;
    });
  }).catch(() => {});
  
  sites = [];
  const sitesCol = db.collection('users').doc(uidCur).collection('sites');
  await sitesCol.get().then(snap => {
    snap.forEach(doc => {
      const data = doc.data();
      sites.push({ id: doc.id, ...data });
    });
  }).catch(() => {});
  
  surveys = [];
  await lightingSurveysCol.get().then(snap => {
    snap.forEach(doc => {
      const data = doc.data();
      surveys.push({ id: doc.id, ...data });
    });
  }).catch(() => {});
}

function showAuthScreen() {
  $('main').innerHTML = `
    <div class="card" style="max-width: 360px; margin: 3rem auto; text-align: center;">
      <h2>Legency Lighting</h2>
      <p class="note" style="margin-bottom: 1.5rem;">Sign in to start collecting lighting survey data.</p>
      <button class="pri" id="authGoogle" style="width: 100%; margin-bottom: 0.9rem;">Sign in with Google</button>
      <div class="note" style="margin: 0 0 0.9rem;">— or use email and password —</div>
      <input id="authEmail" type="email" placeholder="Email address" style="margin-bottom: 0.6rem;">
      <input id="authPass" type="password" placeholder="Password" style="margin-bottom: 0.9rem;">
      <button class="pri" id="authGo" style="width: 100%;">Sign in</button>
      <div class="note" id="authStatus" style="margin-top: 0.7rem;"></div>
      <div class="note" style="margin-top: 1rem;"><a id="authToggle" style="color: var(--navy); cursor: pointer;">New here? Create an account</a></div>
    </div>
  `;
  
  let mode = 'signin';
  $('authToggle').onclick = () => {
    mode = mode === 'signin' ? 'signup' : 'signin';
    $('authToggle').textContent = mode === 'signin' ? 'New here? Create an account' : 'Already have an account? Sign in';
    $('authGo').textContent = mode === 'signin' ? 'Sign in' : 'Create account';
  };
  
  $('authGoogle').onclick = async () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch (e) {
      $('authStatus').textContent = e.message;
    }
  };
  
  $('authGo').onclick = async () => {
    const email = $('authEmail').value.trim();
    const pass = $('authPass').value;
    if (!email || !pass) { toast('Email and password required'); return; }
    try {
      if (mode === 'signup') {
        await auth.createUserWithEmailAndPassword(email, pass);
      } else {
        await auth.signInWithEmailAndPassword(email, pass);
      }
    } catch (e) {
      $('authStatus').textContent = e.message;
    }
  };
}

function paint() {
  if (!uidCur) { showAuthScreen(); return; }
  
  if (V.page === 'dash') paintDash();
  else if (V.page === 'custlist') paintCustList();
  else if (V.page === 'sitelist') paintSiteList();
  else if (V.page === 'surveylist') paintSurveyList();
  else if (V.page === 'newentry') paintNewEntry();
  else if (V.page === 'ref') paintRef();
  else if (V.page === 'viewentry') paintViewEntry();
  else if (V.page === 'assump') paintAssump();
}

// ---------- Reference data (from the Lighting template's reference tabs) ----------
const LUX_REF = [
  ['General office', '300–500', 'Screen-based work favours lower end'],
  ['Reception', '300', ''],
  ['Meeting room', '300–500', ''],
  ['Corridors / circulation', '100', ''],
  ['Stairs', '150', ''],
  ['WC / toilets', '100–150', ''],
  ['Storage / warehouse (general)', '100–150', ''],
  ['Warehouse (fine picking)', '300', ''],
  ['Retail (general)', '300–500', ''],
  ['Retail (till/display)', '500–750', ''],
  ['Industrial (general assembly)', '300', ''],
  ['Industrial (fine work)', '500–750', ''],
  ['Plant rooms', '150', ''],
  ['Car parks (covered)', '50–75', ''],
  ['Commercial kitchen', '500', ''],
  ['Classroom', '300–500', '']
];
const TUBE_REF = [
  { group: 'T8 (26 mm diameter, G13 bi-pin) — most common in commercial buildings', rows: [
    ['2ft (600 mm)', 'F18W', 18, ''], ['3ft (900 mm)', 'F30W', 30, ''],
    ['4ft (1200 mm)', 'F36W', 36, 'Most common office/retail size'],
    ['5ft (1500 mm)', 'F58W', 58, ''], ['6ft (1800 mm)', 'F70W', 70, 'Less common size']
  ]},
  { group: 'T5 HE (16 mm diameter, standard output)', rows: [
    ['549 mm', 'FQ14W / F14T5', 14, ''], ['849 mm', 'FQ21W / F21T5', 21, ''],
    ['1149 mm', 'FQ28W / F28T5', 28, ''], ['1449 mm', 'FQ35W / F35T5', 35, '']
  ]},
  { group: 'T5 HO (high output)', rows: [
    ['549 mm', 'F24W/HO', 24, ''], ['849 mm', 'F39W/HO', 39, ''],
    ['1149 mm', 'F54W/HO', 54, ''], ['1449 mm', 'F80W/HO', 80, '']
  ]},
  { group: 'T12 (38 mm) — largely phased out, still found in older buildings', rows: [
    ['4ft (1200 mm)', 'F40W', 40, ''], ['8ft (2400 mm)', 'F75W', 75, 'Slimline'], ['8ft (2400 mm)', 'F110W', 110, 'High output']
  ]}
];
const BALLAST_NOTES = [
  'Driver loss normally already included in stated luminaire wattage',
  'Industry rule of thumb — electronic ballasts run ~20–25% more efficiently than magnetic',
  'Industry rule of thumb — magnetic ballast loss typically ~15–25% over lamp nominal wattage',
  'Conservative mid-point estimate — confirm on site where possible'
];

function openRef(from) {
  V.refBack = from;
  if (!V.refTab) V.refTab = 'lux';
  V.page = 'ref';
  paint();
}

function paintRef() {
  const fromForm = V.refBack === 'newentry';
  $('crumb').textContent = 'Reference';
  $('bar').style.display = 'flex';
  $('bar').innerHTML = '<button class="gh" id="backBtn">Back</button>';

  const tabs = [['lux', 'Lux levels'], ['leds', 'LED & lamp wattages'], ['tubes', 'Tube wattages'], ['ballast', 'Ballast loss']];
  let html = '<h2>Reference</h2><div class="tabs">' +
    tabs.map(([k, l]) => `<button class="${V.refTab === k ? 'pri' : 'gh'}" data-tab="${k}">${l}</button>`).join('') + '</div>';

  if (V.refTab === 'lux') {
    html += `<p class="note">Typical recommended illuminance. Indicative only — confirm against the current CIBSE/SLL Code for Lighting and BS EN 12464-1 for critical or specialist spaces.</p>`;
    html += '<div class="tblwrap"><table class="reftbl"><thead><tr><th>Space type</th><th>Lux</th></tr></thead><tbody>' +
      LUX_REF.map(r => `<tr><td>${esc(r[0])}${r[2] ? `<div class="note">${esc(r[2])}</div>` : ''}</td><td class="n">${esc(r[1])}</td></tr>`).join('') +
      '</tbody></table></div>';
  } else if (V.refTab === 'leds') {
    html += `<p class="note">Typical <b>watts per lamp</b> (whole fitting for integral LED). Picking a lamp / fitting fills the wattage automatically; a value you type always overrides it. Basis: <b>A</b> published catalogue rating, <b>B</b> indicative only, <b>T</b> your Energy Survey Tool, <b>E</b> Envantage Audit Calcs workbook (whole-fitting watts including control gear \u2014 Lamps per luminaire is set to 1 and ballast loss is not added again). Typical values, not measured loads \u2014 use the nameplate where you can.${fromForm ? ' Tap <b>Use</b> to select one for the luminaire you are entering.' : ''}</p>`;
    html += '<input id="refQ" type="search" placeholder="Search e.g. batten, high bay, T8" style="width:100%;margin:0.4rem 0 0.6rem;padding:0.55rem 0.7rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)">';
    LDGRP.forEach(g => {
      html += `<div class="refhead" data-g>${esc(g)}</div><div class="tblwrap" data-gt><table class="reftbl"><thead><tr><th>Lamp / fitting</th><th>W</th><th>Basis</th>${fromForm ? '<th></th>' : ''}</tr></thead><tbody>` +
        LDREF.filter(r => r[0] === g).map(r => `<tr data-q="${esc((r[1] + ' ' + g).toLowerCase())}"><td>${esc(r[1])}<div class="note">${esc(r[6])}${r[7] != null ? ' LED replacement: ' + r[7] + ' W.' : ''}</div></td><td class="n">${r[2]} W${r[3] != null && r[4] != null ? '<div class="note">' + r[3] + '\u2013' + r[4] + '</div>' : ''}</td><td>${r[5]}</td>${fromForm ? `<td><button class="gh" data-ref="${esc(r[1])}">Use</button></td>` : ''}</tr>`).join('') +
        '</tbody></table></div>';
    });
    html += '<details class="card note"><summary><b>Sources</b></summary><ul>' + LDSRC.map(x => '<li>' + (x[1] ? '<a href="' + x[1] + '" target="_blank" rel="noopener">' + esc(x[0]) + '</a>' : esc(x[0])) + '</li>').join('') + '</ul></details>';
  } else if (V.refTab === 'tubes') {
    html += `<p class="note">Nominal wattages of common linear fluorescent tubes.${fromForm ? ' Tap <b>Use</b> to put a wattage into the luminaire you are entering.' : ''}</p>`;
    TUBE_REF.forEach(g => {
      html += `<div class="refhead">${esc(g.group)}</div><div class="tblwrap"><table class="reftbl"><thead><tr><th>Length</th><th>Code</th><th>W</th>${fromForm ? '<th></th>' : ''}</tr></thead><tbody>` +
        g.rows.map(r => `<tr><td>${esc(r[0])}${r[3] ? `<div class="note">${esc(r[3])}</div>` : ''}</td><td>${esc(r[1])}</td><td class="n">${r[2]} W</td>${fromForm ? `<td><button class="gh" data-watt="${r[2]}">Use</button></td>` : ''}</tr>`).join('') +
        '</tbody></table></div>';
    });
    html += `<div class="card note"><b>Supply of new tubes:</b> in Great Britain the RoHS mercury exemptions for linear fluorescent lamps (T5, T8, T12) and CFLs under 30 W ended on 1 February 2024, so new non-compliant lamps can no longer be placed on the market — useful context when recommending LED replacement. Source: <a href="https://www.legislation.gov.uk/uksi/2023/658/made" target="_blank" rel="noopener" style="color:var(--navy)">SI 2023/658</a>. Check current guidance for stock and Northern Ireland.</div>`;
  } else {
    html += `<p class="note">Extra power drawn by the ballast / driver on top of the lamp wattage. The app applies the figure automatically: <b>load = lamps × lamp W × (1 + loss) × no. of luminaires ÷ 1000</b>. Where the ballast is left on Auto it is picked from the lamp technology (LED/halogen/incandescent 0%, T5 high-frequency 8%, T8 magnetic 20%, other 15%). These are rule-of-thumb figures, not a substitute for a clamp-meter reading.</p>`;
    html += '<div class="tblwrap"><table class="reftbl"><thead><tr><th>Ballast / driver type</th><th>Loss</th></tr></thead><tbody>' +
      BALLASTS.map((b, i) => `<tr><td>${esc(b)}<div class="note">${esc(BALLAST_NOTES[i])}</div></td><td class="n">${Math.round(BALLAST_LOSS[i] * 100)}%</td></tr>`).join('') +
      '</tbody></table></div>';
  }

  $('main').innerHTML = html;
  $('backBtn').onclick = () => { V.page = V.refBack || 'dash'; paint(); };
  document.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => { V.refTab = b.dataset.tab; paint(); }; });
  if ($('refQ')) $('refQ').oninput = ev => {
    const q = ev.target.value.toLowerCase().trim();
    document.querySelectorAll('tr[data-q]').forEach(r => { r.style.display = !q || r.dataset.q.includes(q) ? '' : 'none'; });

const fmtKw = n => n.toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtKwh = n => Math.round(n).toLocaleString('en-GB');

function siteDashboardHtml(siteSurveys) {
  let totalKw = 0, totalKwh = 0, fittings = 0;
  const zones = {};
  siteSurveys.forEach(sv => (sv.entries || []).forEach(e => {
    const kw = parseFloat(e.load) || 0;
    const kwh = parseFloat(e.energy) || 0;
    totalKw += kw; totalKwh += kwh; fittings += parseFloat(e.qty) || 0;
    const name = (e.zone || '(no zone)').trim();
    const key = name.toLowerCase();
    if (!zones[key]) zones[key] = { name, kw: 0, kwh: 0, fittings: 0 };
    zones[key].kw += kw; zones[key].kwh += kwh; zones[key].fittings += parseFloat(e.qty) || 0;
  }));
  const zoneList = Object.values(zones).sort((a, b) => b.kwh - a.kwh);
  if (!zoneList.length) return '';

  let h = '<div class="tiles">';
  h += `<div class="tile big"><div class="tl">Total lighting load</div><div class="tv">${fmtKw(totalKw)} <small>kW</small></div><div class="ts">${fmtKwh(fittings)} luminaires</div></div>`;
  h += `<div class="tile big"><div class="tl">Total annual energy</div><div class="tv">${fmtKwh(totalKwh)} <small>kWh/yr</small></div><div class="ts">${zoneList.length} zone${zoneList.length !== 1 ? 's' : ''}</div></div>`;
  h += '</div>';
  let sK = 0, sG = 0, sC = 0;
  siteSurveys.forEach(sv => { const r = surveySavings(sv); sK += r.t.saveKwh; sG += r.t.saveGbp; sC += r.t.saveCo2; });
  if (sK > 0) h += '<div class="tiles"><div class="tile"><div class="tl">Potential saving</div><div class="tv">' + fmtKwh(sK) + ' <small>kWh/yr</small></div><div class="ts">' + gbp(sG) + '/yr \u2022 ' + sC.toFixed(1) + ' tCO\u2082e</div></div></div>';
  h += '<h3>By zone</h3><div class="tiles">';
  zoneList.forEach(z => {
    const pct = totalKwh > 0 ? Math.round((z.kwh / totalKwh) * 100) : 0;
    h += `<div class="tile"><div class="zone-name">${esc(z.name)}</div>
      <div class="tl">Load</div><div class="tv" style="font-size:1.25rem">${fmtKw(z.kw)} <small>kW</small></div>
      <div class="tl" style="margin-top:0.4rem">Energy</div><div class="tv" style="font-size:1.25rem">${fmtKwh(z.kwh)} <small>kWh/yr</small></div>
      <div class="zbar"><span style="width:${pct}%"></span></div><div class="ts">${pct}% of site energy</div></div>`;
  });
  h += '</div>';
  return h;
}

  html += `<div class="note" style="margin-bottom: 1rem;">Tap <b>+ Add Luminaire</b> to log each light fitting, zone, or area.</div>`;

      html += `

          <div style="display:flex;justify-content:space-between;align-items:start;gap:0.5rem">
            <div>
              <div style="font-weight:600">${esc(e.zone || '(no zone)')}</div>

              <div class="note" style="margin-top:0.3rem"><b>${e.load || '—'} kW</b> • ${e.energy || '—'} kWh/yr</div>${(() => { const c = calcSave(e, getA(sv)); return c.m !== 'N' && c.saveKwh > 0 ? `<div class="note" style="margin-top:0.3rem;color:var(--navy);font-weight:600">Saves ${fmtKwh(c.saveKwh)} kWh/yr (${gbp(c.saveGbp)}) \u2022 payback ${yrs(c.payback)}</div>` : ''; })()}
            </div>
            <button class="gh" data-edit="${i}" style="white-space:nowrap">Edit</button>
          </div>
        </div>
      `;
    }
  }
  
  html += '<button class="pri" id="addBtn" style="width:100%;margin-top:1rem">+ Add Luminaire</button>';
  
  $('main').innerHTML = html;
  
  $('backBtn').onclick = () => { V.page = 'surveylist'; paint(); };
  $('addBtn').onclick = () => { V.entry = {}; V.entryIdx = null; V.page = 'newentry'; paint(); };
  
  document.querySelectorAll('[data-edit]').forEach(el => {
    el.onclick = () => {
      V.entryIdx = parseInt(el.dataset.edit);
      V.entry = Object.assign({}, sv.entries[V.entryIdx]);
      V.page = 'newentry';
      paint();
    };
  });
  
  $('asBtn').onclick = () => { V.page = 'assump'; paint(); };
  $('exportCsvBtn').onclick = () => exportCsv(sv);
  $('fillWbBtn').onclick = () => fillWorkbook(sv);
}

const BALLASTS = ['LED driver (no tube)', 'High Frequency (electronic)', 'Conventional (magnetic)', 'Unknown / not recorded'];
const BALLAST_LOSS = [0, 0.08, 0.2, 0.15];
const CONTROL_TYPES = [
  'Manual switch',
  'Time clock / timer',

  'Daylight sensor / photocell',

// Map any saved/typed ballast text to one of the four template names ('' if none chosen)
function canonBallast(b) {
  const s = (b || '').toLowerCase();
  if (s.startsWith('led')) return BALLASTS[0];
  if (s.startsWith('high')) return BALLASTS[1];
  if (s.startsWith('conv')) return BALLASTS[2];
  if (s.startsWith('unknown')) return BALLASTS[3];
  return '';
}
// Chosen ballast, or one derived from the lamp technology when left on Auto
function resolveBallast(b, tech) {
  const c = canonBallast(b);
  if (c) return c;
  const t = (tech || '').toLowerCase();
  if (t === 'led' || t === 'halogen' || t === 'incandescent') return BALLASTS[0];
  if (t.includes('t5')) return BALLASTS[1];
  if (t.includes('t8')) return BALLASTS[2];
  return BALLASTS[3];
}
function ballastLossFor(b, tech) { return BALLAST_LOSS[BALLASTS.indexOf(resolveBallast(b, tech))]; }

// Recalculate the derived fields on an entry object (mutates and returns it)
function recalcEntry(e) {
  const lamps = parseFloat(e.lamps) || 0;
  const watt = effWatt(e).w;
  const qty = parseFloat(e.qty) || 0;
  const hours = parseFloat(e.hours) || 0;
  const daysWk = parseFloat(e.daysWk);
  const weeksYr = parseFloat(e.weeksYr);
  if (!isNaN(daysWk)) {
    // Days per year comes from days/week x weeks/year (weeks default to 52)
    e.days = String(Math.round(daysWk * (isNaN(weeksYr) ? 52 : weeksYr)));
  }
  const days = parseFloat(e.days) || 0;
  const _x = effWatt(e), gearIn = _x.src === 'Reference' && _x.ref && _x.ref.b === 'E';   // Envantage watts already include control gear
  const perUnitKw = (lamps * watt * (1 + (gearIn ? 0 : ballastLossFor(e.ballast, e.tech)))) / 1000;
  const load = perUnitKw * qty;
  e.load = load.toFixed(2);
  e.burnHours = String(Math.round(hours * days));
  e.energy = String(Math.round(load * hours * days));
  return e;
}

  return e.ctrlType === 'Other' ? (e.ctrlOther || 'Other') : (e.ctrlType || '');

        <select id="fControls">${optionsHtml(['Yes', 'No'], e.controls, '—')}</select>

      <div class="fld" id="ctrlTypeWrap" style="display:${e.controls === 'Yes' ? 'block' : 'none'}">
        <label>Type of Control</label>
        <select id="fCtrlType">${optionsHtml(CONTROL_TYPES, e.ctrlType, 'Choose control type')}</select>
      </div>

      <div class="fld" id="ctrlOtherWrap" style="display:${e.controls === 'Yes' && e.ctrlType === 'Other' ? 'block' : 'none'}">
        <label>Other control type (please specify)</label>
        <input id="fCtrlOther" value="${esc(e.ctrlOther || '')}" placeholder="Describe the control">
      </div>

      <div class="fld">
        <label>Comments / Condition</label>
        <textarea id="fComments" placeholder="Age, condition, recommendations...">${esc(e.comments || '')}</textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Auto-Calculated</div>
      <div class="grid2">
        <div>
          <label>Total Connected Load (kW)</label>
          ${calcBox('cLoad', e.load)}
        </div>
        <div>
          <label>Annual Burn Hours</label>
          ${calcBox('cBurn', e.burnHours)}
        </div>
        <div>
          <label>Annual Energy (kWh)</label>
          ${calcBox('cEnergy', e.energy)}
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Energy-saving measures</div>
      <div class="note" style="margin-bottom:0.8rem">Leave <b>Measure</b> on Auto to get a recommendation: existing non-LED fittings are matched to an LED replacement. Choose another option to test fitting replacement, controls, or both. Assumptions are under <b>Savings assumptions</b> on the survey page.</div>
      <div class="fld">
        <label>Measure</label>
        <select id="fMeasure">${[['', 'Auto (recommended)'], ['N', 'No measure'], ['Y-F', 'Replace fitting only'], ['Y-FC', 'Replace fitting + add controls'], ['Y-C', 'Add controls only']].map(o => `<option value="${o[0]}"${o[0] === (e.measure || '') ? ' selected' : ''}>${o[1]}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label>Proposed fitting</label>
        <select id="fProp"><option value="">Envantage replacement / none</option>${LDLED.map(n => `<option${n === e.prop ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>
        <div class="note">Optional. Leave on the default to use Envantage\u2019s LED replacement for the existing fitting.</div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Proposed wattage (W per fitting)</label><input id="fPW" type="number" inputmode="decimal" step="0.1" value="${esc(e.pw || '')}" placeholder="auto"></div>
        <div class="fld"><label>Fitting cost (\u00a3 each)</label><input id="fPCost" type="number" inputmode="decimal" step="0.01" value="${esc(e.pcost || '')}" placeholder="auto"></div>
        <div class="fld"><label>Install cost (\u00a3 each)</label><input id="fPInst" type="number" inputmode="decimal" step="0.01" value="${esc(e.pinst || '')}" placeholder="auto"></div>
      </div>
      <div class="fld">
        <label>Proposed control</label>
        <select id="fPCtrl">${CTRL_OPTS.map(o => `<option${o.n === (e.pctrl || CTRL_OPTS[0].n) ? ' selected' : ''}>${esc(o.n)}</option>`).join('')}</select>
      </div>
      <div class="grid2">
        <div class="fld"><label>No. of controls</label><input id="fNCtrl" type="number" inputmode="numeric" value="${esc(e.nctrl || '')}" placeholder="auto"></div>
        <div class="fld"><label>Control saving (%)</label><input id="fCSav" type="number" inputmode="decimal" step="0.5" value="${esc(e.csav || '')}" placeholder="auto"></div>
      </div>
      <div id="sRes" style="margin-top:0.6rem"></div>
      <details style="margin-top:0.8rem"><summary><b>Controls options for this group</b></summary><div id="sOpts"></div></details>
    </div>
  `;

  $('main').innerHTML = html;

  // Read every field into the entry object. Runs on every keystroke / change,
  // and updates the calculated boxes in place (no re-render), so nothing the
  // user has typed can be lost.
  const sync = () => {
    e.zone = $('fZone').value;
    e.type = $('fType').value;
    const newRef = $('fRef').value;
    if (newRef !== (e.ref || '')) { e.ref = newRef; if (newRef) { $('fTech').value = techForRef(newRef); if (LDMAP[newRef].b === 'E' && !$('fLamps').value) $('fLamps').value = '1'; const rr = LDMAP[newRef]; if (rr.mount && !$('fMount').value) $('fMount').value = rr.mount; if (rr.inst && !$('fAccess').value) $('fAccess').value = rr.inst; } }
    e.tech = $('fTech').value;
    e.ballast = $('fBallast').value;
    e.lamps = $('fLamps').value;
    e.watt = $('fWatt').value;
    e.qty = $('fQty').value;
    e.lux = $('fLux').value;

    e.pattern = $('fPattern').value;
    const preset = OP_PATTERNS.find(p => p.label === e.pattern);
    const isPreset = !!(preset && preset.days !== null);
    if (isPreset) $('fDaysWk').value = preset.days;
    $('fDaysWk').disabled = isPreset;
    e.daysWk = $('fDaysWk').value;
    e.weeksYr = $('fWeeksYr').value;
    e.hours = $('fHours').value;

    e.controls = $('fControls').value;
    e.ctrlType = $('fCtrlType').value;
    e.ctrlOther = $('fCtrlOther').value;
    e.comments = $('fComments').value;
    e.mount = $('fMount').value; e.access = $('fAccess').value;
    e.measure = $('fMeasure').value; e.prop = $('fProp').value; e.pw = $('fPW').value; e.pcost = $('fPCost').value; e.pinst = $('fPInst').value;
    e.pctrl = $('fPCtrl').value; e.nctrl = $('fNCtrl').value; e.csav = $('fCSav').value;

    $('ctrlTypeWrap').style.display = e.controls === 'Yes' ? 'block' : 'none';
    $('ctrlOtherWrap').style.display = e.controls === 'Yes' && e.ctrlType === 'Other' ? 'block' : 'none';

    recalcEntry(e);
    $('wNote').textContent = wattNote(e);
    const A_ = getA(sv); $('sRes').innerHTML = saveHtml(e, A_); $('sOpts').innerHTML = optsHtml(e, A_);
    $('fWatt').placeholder = LDMAP[e.ref] ? 'Auto: ' + LDMAP[e.ref].w + ' W' : 'e.g. 36';
    $('cDays').textContent = e.days || '—';
    $('cLoad').textContent = e.load && parseFloat(e.load) ? e.load : '—';
    $('cBurn').textContent = e.burnHours && parseFloat(e.burnHours) ? e.burnHours : '—';
    $('cEnergy').textContent = e.energy && parseFloat(e.energy) ? e.energy : '—';

    [['fZone', e.zone], ['fType', e.type], ['fTech', e.tech], ['fQty', e.qty]].forEach(([id, v]) => {
      const f = $(id).closest('.fld');
      f.classList.toggle('ok', !!(v && String(v).trim()));
      f.classList.toggle('rq', !(v && String(v).trim()));
    });
  };

  document.querySelectorAll('#main input, #main select, #main textarea').forEach(el => {
    el.oninput = sync;
    el.onchange = sync;
  });
  sync();

  $('backBtn').onclick = () => { V.page = 'viewentry'; paint(); };
  $('saveBtn').onclick = () => {
    sync();
    e.zone = e.zone.trim();
    if (!e.zone || !e.type || !e.tech || !e.qty) { toast('Zone, type, technology and quantity are required'); return; }
    if (e.controls !== 'Yes') { e.ctrlType = ''; e.ctrlOther = ''; }
    if (e.ctrlType !== 'Other') e.ctrlOther = '';

    if (V.entryIdx !== null) {
      sv.entries[V.entryIdx] = e;
    } else {
      if (!sv.entries) sv.entries = [];
      sv.entries.push(e);
    }

    lightingSurveysCol.doc(V.surveyId).set(sv).catch(err => toast(err.message));
    V.page = 'viewentry';
    paint();
  };
}

function exportCsv(sv) {
  const site = sites.find(s => s.id === V.siteId);
  const rows = [['Site', 'Zone / Area', 'Type of Luminaire', 'Lamp Technology', 'Ballast / Driver Type', 'Lamps per Luminaire', 'Lamp Wattage (W)', 'No. of Luminaires', 'Measured Lux Level', 'Controls Fitted? (Y/N)', 'Type of Control', 'Hours per Day', 'Operating Pattern', 'Days per Week', 'Weeks per Year', 'Days per Year', 'Total Load (kW)', 'Annual Burn Hours', 'Annual Energy (kWh)', 'Comments', 'Wattage Source', 'Mounting', 'Installation Access', 'Measure', 'Recommendation', 'Proposed Fitting', 'Proposed Wattage (W)', 'Proposed Energy (kWh/yr)', 'Saving (kWh/yr)', 'Saving (GBP/yr)', 'Saving (tCO2e/yr)', 'Capital Cost (GBP)', 'Capital incl. Labour (GBP)', 'Simple Payback (yrs)']];
  const A = getA(sv);
  
  (sv.entries || []).forEach(e => {
    rows.push([
      site.name,
      e.zone || '',
      e.type || '',
      e.tech || '',
      resolveBallast(e.ballast, e.tech),
      e.lamps || '',
      (effWatt(e).src ? String(effWatt(e).w) : ''),
      e.qty || '',
      e.lux || '',
      e.controls === 'Yes' ? 'Y' : e.controls === 'No' ? 'N' : (e.controls || ''),
      controlLabel(e),
      e.hours || '',
      e.pattern || '',
      e.daysWk || '',
      e.weeksYr || '',
      e.days || '',
      e.load || '',
      e.burnHours || '',
      e.energy || '',
      e.comments || '',
      effWatt(e).src,
      ...(() => { const c = calcSave(e, A), on = c.m !== 'N' && c.saveKwh > 0, r1 = (v, d) => on && v !== null && v !== undefined ? Number(v.toFixed(d)) : ''; return [e.mount || '', e.access || '', c.m, on ? recText(e, c) : '', on && c.m !== 'Y-C' ? c.P.name : '', on && c.m !== 'Y-C' ? c.P.w : '', r1(c.propKwh, 0), r1(c.saveKwh, 0), r1(c.saveGbp, 0), r1(c.saveCo2, 3), on && c.costKnown ? Math.round(c.total) : '', on && c.costKnown ? Math.round(c.totalLab) : '', r1(c.payback, 2)]; })()
    ]);
  });
  
  const csv = rows.map(r => r.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${site.name.replace(/[^a-z0-9]+/gi, '_')}_lighting_survey.csv`;
  a.click();
  toast('CSV exported');
}

async function fillWorkbook(sv) {
  const site = sites.find(s => s.id === V.siteId) || {};
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx';
  input.onchange = async ev => {
    const file = ev.target.files[0];
    if (!file) return;
    try {
      toast('Reading template...');
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const sheetFile = zip.file('xl/worksheets/sheet1.xml');
      if (!sheetFile) { toast('Could not find the Lighting Schedule sheet in this file'); return; }
      const doc = new DOMParser().parseFromString(await sheetFile.async('string'), 'text/xml');
      const NS = doc.documentElement.namespaceURI;

      // Index every existing row/cell by reference so we can write by address
      const rowMap = {}, cellMap = {};
      Array.from(doc.getElementsByTagName('row')).forEach(r => { rowMap[r.getAttribute('r')] = r; });
      Array.from(doc.getElementsByTagName('c')).forEach(c => { cellMap[c.getAttribute('r')] = c; });

      let skipped = 0;
      const setCell = (ref, val) => {
        const cell = cellMap[ref];
        if (!cell) { skipped++; return; }
        // clear existing content (value, inline string, formula) but keep the cell style
        Array.from(cell.childNodes).forEach(n => cell.removeChild(n));
        cell.removeAttribute('t');
        if (val === '' || val === null || val === undefined) return;
        const isNum = typeof val === 'number' && isFinite(val);
        if (isNum) {
          cell.setAttribute('t', 'n');
          const v = doc.createElementNS(NS, 'v'); v.textContent = String(val); cell.appendChild(v);
        } else {
          cell.setAttribute('t', 'inlineStr');
          const is = doc.createElementNS(NS, 'is'); const t = doc.createElementNS(NS, 't');
          t.textContent = String(val); is.appendChild(t); cell.appendChild(is);
        }
      };
      const num = v => { const n = parseFloat(v); return isNaN(n) ? '' : n; };

      // Header block
      const custName = (cust[V.custKey] || {}).name || '';
      setCell('B2', [custName, site.name].filter(Boolean).join(' / '));
      setCell('B4', sv.date || '');

      // Rows 10-49 are the data rows in the template (row 50 is the TOTAL row)
      const entries = sv.entries || [];
      entries.slice(0, 40).forEach((e, i) => {
        const r = 10 + i;
        const ctrlYes = e.controls === 'Yes';
        setCell('A' + r, e.zone || '');
        setCell('B' + r, e.type || '');
        setCell('C' + r, e.tech || '');
        setCell('D' + r, resolveBallast(e.ballast, e.tech));   // must match the template's lookup list exactly
        setCell('E' + r, num(e.lamps));
        setCell('F' + r, effWatt(e).src ? effWatt(e).w : num(e.watt));
        setCell('G' + r, num(e.qty));
        setCell('H' + r, num(e.lux));
        setCell('K' + r, ctrlYes ? 'Y' : e.controls === 'No' ? 'N' : '');
        setCell('L' + r, ctrlYes ? controlLabel(e) : (e.controls === 'No' ? 'None' : ''));
        setCell('M' + r, num(e.hours));
        setCell('N' + r, num(e.days));
        setCell('Q' + r, e.comments || '');
      });
      // Clear the template's example row if this survey has no entries to replace it
      if (!entries.length) ['A','B','C','D','E','F','G','H','K','L','M','N','Q'].forEach(c => setCell(c + '10', ''));

      zip.file('xl/worksheets/sheet1.xml', new XMLSerializer().serializeToString(doc));

      // Ask Excel to recalculate the formula columns (ballast %, load, burn hours, kWh) on open
      const wbFile = zip.file('xl/workbook.xml');
      if (wbFile) {
        let wbXml = await wbFile.async('string');
        if (/<calcPr[^>]*>/.test(wbXml)) {
          wbXml = wbXml.replace(/<calcPr([^>]*?)\/?>/, (m, a) => '<calcPr' + a.replace(/\sfullCalcOnLoad="[^"]*"/, '') + ' fullCalcOnLoad="1"/>');
        } else {
          wbXml = wbXml.replace('</workbook>', '<calcPr fullCalcOnLoad="1"/></workbook>');
        }
        zip.file('xl/workbook.xml', wbXml);
      }

      const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(site.name || 'site').replace(/[^a-z0-9]+/gi, '_')}_${sv.date || 'lighting'}_Lighting_FILLED.xlsx`;
      a.click();

      let msg = 'Workbook filled and downloaded';
      if (entries.length > 40) msg += ` — only the first 40 of ${entries.length} luminaires fit the template`;
      if (skipped) msg += ` (${skipped} cells not found in template)`;
      toast(msg);
    } catch (err) {
      toast('Error: ' + err.message);
      console.error(err);
    }
  };
  input.click();
}

window.onload = () => {
  if (uidCur) loadData().then(() => paint());
};

paint();
</script>
